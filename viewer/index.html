const GROUP_KEYS = ["beginner", "meta", "original", "advanced"];
const STAT_LABELS = ["H", "A", "B", "C", "D", "S"];
const NATURE_CORR = {
  "がんばりや": "補正なし", "さみしがり": "A↑ B↓", "ゆうかん": "A↑ S↓", "いじっぱり": "A↑ C↓", "やんちゃ": "A↑ D↓",
  "ずぶとい": "B↑ A↓", "のんき": "B↑ S↓", "わんぱく": "B↑ C↓", "のうてんき": "B↑ D↓",
  "おくびょう": "S↑ A↓", "せっかち": "S↑ B↓", "ようき": "S↑ C↓", "むじゃき": "S↑ D↓",
  "ひかえめ": "C↑ A↓", "おっとり": "C↑ B↓", "れいせい": "C↑ S↓", "うっかりや": "C↑ D↓",
  "おだやか": "D↑ A↓", "おとなしい": "D↑ B↓", "なまいき": "D↑ S↓", "しんちょう": "D↑ C↓",
};
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pct(r) { return (r * 100).toFixed(1) + "%"; }
function statsText(stats) { return stats.join("-"); }
function allocText(alloc) { return STAT_LABELS.map((l, i) => l + (alloc[i] ?? 0)).join(" "); }
function helpTip(text, label) {
  return `<span role="img" tabindex="0" title="${esc(text)}" aria-label="${esc(label)}の説明：${esc(text)}" class="help">?</span>`;
}
function winTone(r) { return r >= 0.5 ? "good" : "bad"; }
function rateTextCls(r) { return r >= 0.5 ? "rate-acc" : r >= 0.4 ? "rate-warn" : "rate-danger"; }
function rateCellCls(r) {
  if (r >= 0.65) return "cell-1"; if (r >= 0.55) return "cell-2"; if (r >= 0.5) return "cell-3";
  if (r >= 0.45) return "cell-4"; if (r >= 0.35) return "cell-5"; return "cell-6";
}
function winBar(rate, label) {
  const cls = rate >= 0.5 ? "var(--accent)" : rate >= 0.4 ? "var(--warn)" : "var(--danger)";
  return `<span class="winbar"><span class="wlabel">${esc(label)}</span>` +
    `<span class="wtrack" role="img" aria-label="${esc(label)} ${pct(rate)}"><span class="wfill" style="width:${Math.round(rate * 100)}%;background:${cls}"></span></span>` +
    `<span class="wval ${rateTextCls(rate)}">${pct(rate)}</span></span>`;
}

const PRESETS2 = [

];
let runKey = "run3";
const evalState = {};
function getEvalState(variant) {
  if (!evalState[variant]) {
    evalState[variant] = {
      weights: variant === "run3"
        ? { beginner: 34, meta: 0, original: 33, advanced: 33 }
        : { beginner: 25, meta: 25, original: 25, advanced: 25 },
      selectedIdx: null,
      sort: { key: "expected", dir: "desc" },
    };
  }
  return evalState[variant];
}
function sliderBundle(variant) {
  return variant === "run3"
    ? { META: DATA.slider3.meta, BUILDS: DATA.slider3.builds, presets: PRESETS3 }
    : { META: DATA.slider2.meta, BUILDS: DATA.slider2.builds, presets: PRESETS2 };
}
function activeKeysOf(variant) {
  return variant === "run3" ? ["beginner", "original", "advanced"] : GROUP_KEYS;
}
/* Linked sliders: values always sum to exactly 100 (same algorithm as the original). */
function setLinked(variant, key, raw) {
  const st = getEvalState(variant);
  const activeKeys = activeKeysOf(variant);
  const prev = st.weights;
  const others = activeKeys.filter((k) => k !== key);
  const othersTotal = others.reduce((s, k) => s + (prev[k] ?? 0), 0);
  const value = Math.max(0, Math.min(100, Math.round(raw), (prev[key] ?? 0) + othersTotal));
  const delta = value - (prev[key] ?? 0);
  const next = { ...prev, [key]: value };
  if (delta !== 0) {
    const amount = Math.abs(delta);
    const parts = others.map((k) => othersTotal > 0 ? (amount * (prev[k] ?? 0)) / othersTotal : amount / others.length);
    const ints = parts.map((p) => Math.floor(p));
    let remainder = amount - ints.reduce((s, n) => s + n, 0);
    const bySize = others.map((k, i) => ({ k, i })).sort((a, z) => (prev[z.k] ?? 0) - (prev[a.k] ?? 0));
    for (const t of bySize) { if (remainder <= 0) break; ints[t.i] = (ints[t.i] ?? 0) + 1; remainder -= 1; }

  const robust = builds.filter((b) => b.rrWorst >= robustThreshold);
  const shallowest = [...builds].sort((a, b) => b.rrWorst - a.rrWorst).slice(0, 3);
  const shallowestWorst = shallowest[0] ? shallowest[0].rrWorst : 0;
  const robustCards = robust.length > 0 ? robust : shallowest;
  const first = builds[0];
  const counters = first ? builds.filter((b) => b.rank !== first.rank && (b.vsTop20[0] ?? 0) > 0.5)
    .sort((a, b) => (b.vsTop20[0] ?? 0) - (a.vsTop20[0] ?? 0)).slice(0, 3) : [];
  let html = `<section class="pickups" aria-label="計算結果（候補）"><h3 class="sec">候補ピックアップ（${esc(run.title)}）</h3>` +
    `<p class="runmeta">${esc(run.date)} ・ 対象：${esc(run.species)}同種ミラー ・ 仕様と所見はページ最下部の「データ仕様・用語の解説」にまとめています</p>` +
    `<h4>総合上位の候補（平均勝率順）</h4><ul class="cards">${top10.map((b) => buildCard(b, run.species)).join("")}</ul>`;
  html += `<h4>${robust.length > 0 ? `決勝内で最悪相性が浅い候補（決勝総当たりの最悪勝率${robustThreshold}以上・${robust.length}型）` : "決勝内で最悪相性が浅い候補（相対的に浅い順・上位3型）"}</h4>`;
  if (isRun3) html += `<p class="lead">平均勝率だけでなく、決勝に残った型同士の中で「極端に負ける相手が少ない」ことを重視した候補です。ただしrun3でも最悪勝率${robustThreshold}以上を保つ型は0型でした。ここでは相対的に最悪相性が浅い順に3型を並べますが、それでも最も浅い型で最悪${pct(shallowestWorst)}——どの型にも明確な天敵がいます。</p>`;
  else if (isRun2) html += `<p class="lead">平均勝率だけでなく、決勝に残った型同士の中で「極端に負ける相手が少ない」ことを重視した候補です。ただしrun2では最悪勝率${robustThreshold}以上を保つ型は0型でした。ここでは相対的に最悪相性が浅い順に3型を並べますが、それでも最も浅い型で最悪${pct(shallowestWorst)}——どの型にも明確な天敵がいます。</p>`;
  else html += `<p class="lead">平均勝率だけでなく、決勝に残った型同士の中で「極端に負ける相手が少ない」ことを重視した候補です。ただし範囲はあくまで決勝内です。基準プールまで広げると、この${robust.length}型はそろってへるぴん型に3%前後しか勝てていません（各カード下部に表示）。決勝系統が中心の環境では安定しますが、へるぴん型のような型には別の回答が要ります。</p>`;
  html += `<ul class="cards">${robustCards.map((b) => buildCard(b, run.species, robust.length > 0 ? "決勝内で最悪相性が浅い" : "相対的に最悪相性が浅い")).join("")}</ul>`;
  if (first && counters.length > 0) {
    html += `<h4>総合1位（#${first.rank}）に勝てる型 ― 三すくみの相手側</h4>` +
      `<p class="lead">決勝総当たりで1位を相手に勝ち越した型です。1位系統が流行る読みなら、こちらが回答になります。各カードの平均勝率は1位より低くても、ピンポイントでは勝てます。</p>` +
      `<ul class="cards">${counters.map((b) => buildCard(b, run.species, `総合1位への勝率 ${pct(b.vsTop20[0] ?? 0)}`)).join("")}</ul>`;
  }
  if (hasPool) {
    html += `<h3 class="sec" style="margin-top:2rem">基準プール12型への勝率（上位10型）</h3>` +
      `<p class="lead">動画に登場した型や過去の候補など、基準になる12型と当たった場合の勝率です。列ごとに弱点が違うことが分かります。</p>` +
      `<div class="pooltable-wrap"><table class="pool"><thead><tr><th scope="col" style="text-align:left;padding-left:0.5rem">候補</th>${run.pool.map((p) => `<th scope="col">${esc(p.name)}</th>`).join("")}</tr></thead><tbody>` +
      top10.map((b) => `<tr><th scope="row" class="rowh">#${b.rank}<span class="arch">${esc(b.archetype)}</span></th>${b.vsPool.map(([name, r]) => `<td class="${rateTextCls(r)}">${Math.round(r * 100)}</td>`).join("")}</tr>`).join("") +
      `</tbody></table></div><p style="margin:0.25rem 0 0;font-size:0.75rem;color:var(--dim)">単位は%。50が五分、50未満はその相手に負け越しです。</p>`;
  }
  html += `<h3 class="sec" style="margin-top:2rem">上位20型の総当たり表</h3><div id="matrix-box">${matrixHtml(run)}</div>`;
  if (showFullList) {
    const counts = new Map();
    for (const b of builds) counts.set(b.archetype, (counts.get(b.archetype) ?? 0) + 1);
    const archetypes = [...counts.entries()];
    let listed = pickupState.arch === "すべて" ? [...builds] : builds.filter((b) => b.archetype === pickupState.arch);
    if (pickupState.sortMode === "worst") listed.sort((a, b) => b.rrWorst - a.rrWorst);
    html += `<h3 class="sec" style="margin-top:2rem">決勝${builds.length}型の全候補</h3>` +
      `<p class="lead">各行の平均・最悪は決勝${builds.length}型の総当たり内の数値です（基準プールは含みません）。${hasPool ? "基準プール12型への勝率は各行の内訳を開いて確認できます。" : ""}</p>` +
      `<div class="list-tools"><div class="grp" role="group" aria-label="系統で候補を絞り込む">` +
      ["すべて", ...archetypes.map(([a]) => a)].map((a) =>
        `<button type="button" data-arch="${esc(a)}" aria-pressed="${pickupState.arch === a}">${esc(a)}${a !== "すべて" ? `<span class="cnt">${counts.get(a) ?? 0}</span>` : ""}</button>`).join("") +
      `</div><div class="grp2" role="group" aria-label="候補の並び順を切り替える">` +
      `<button type="button" data-sortmode="avg" aria-pressed="${pickupState.sortMode === "avg"}">平均勝率順</button>` +
      `<button type="button" data-sortmode="worst" aria-pressed="${pickupState.sortMode === "worst"}">最悪相性（決勝内）の浅い順</button></div></div>` +
      `<ul class="fulllist">${listed.map((b) => {
        const vs = b.vsPool.length > 0
          ? `<details><summary>基準プール12型への勝率</summary><div class="vspool-grid">${b.vsPool.map(([name, r]) => winBar(r, name)).join("")}</div></details>` : "";
        return `<li><div class="frow"><span class="frank">#${b.rank}</span><strong>${b.form === "mega" ? "メガ" + esc(run.species) : esc(run.species)}</strong>` +
          `<span class="tag" style="border:1px solid var(--border);padding:0 0.25rem;font-size:11px;font-weight:700;color:var(--dim)">${esc(b.archetype)}</span>` +
          `<span>${esc(b.nature)} ・ ${esc(b.ability)} ・ ${esc(b.item)}</span>` +
          `<span class="mono" style="margin-left:auto">平均 <strong class="${rateTextCls(b.rrAvg)}">${pct(b.rrAvg)}</strong> / 最悪（決勝内） <strong class="${rateTextCls(b.rrWorst)}">${pct(b.rrWorst)}</strong></span></div>` +
          `<p class="fstats" style="margin:0.125rem 0 0">SP ${allocText(b.alloc)} ・ 実数値 ${statsText(b.stats)}</p>` +
          `<p style="margin:0.125rem 0 0">技：${esc(b.moves.join(" ／ "))}</p>${vs}</li>`;
      }).join("")}</ul>`;
  }
  if (hasPool) {
    html += `<h3 class="sec" style="margin-top:2rem">基準プール12型（対戦相手の内訳）</h3>` +
      `<p class="lead">第1・第2段階の選考と、上の勝率表の相手になった12型です。動画の登場型（AI型・せつない型・はこふね型・へるぴん型）、過去の候補（候補B・候補C・元候補・A0型）、第1段階の上位（S1-）で構成されます。</p>` +
      `<ul class="poolcards">${run.pool.map((p) => poolCard(p, run.species)).join("")}</ul>`;
  }
  html += `</section>`;
  return html;
}
/* ---------- spec fold (ported SpecDetails) ---------- */
function renderFold(run, sliderVariant) {
  const builds = run.builds;
  const isRun2 = run.key === "run2", isRun3 = run.key === "run3";
  const robustThreshold = isRun2 || isRun3 ? 0.3 : 0.35;
  const robust = builds.filter((b) => b.rrWorst >= robustThreshold);
  const shallowest = [...builds].sort((a, b) => b.rrWorst - a.rrWorst)[0];
  const shallowestWorst = shallowest ? shallowest.rrWorst : 0;
  const shallowestRank = shallowest ? shallowest.rank : 0;
  const sbCount = builds.filter((b) => b.moves.includes("シャドーボール")).length;
  const eqCount = builds.filter((b) => b.moves.includes("じしん")).length;
  const top10 = builds.slice(0, 10);
  const topArchetype = top10[0] ? top10[0].archetype : "";
  const topArchCount = top10.filter((b) => b.archetype === topArchetype).length;
  const first = builds[0];
  const bestNormal = builds.find((b) => b.form === "normal");
  const META = sliderVariant === "run3" ? DATA.slider3.meta : DATA.slider2.meta;
  let groupSection = "";
  if (sliderVariant) {
    const items = GROUP_KEYS.map((k) =>
      `<li>${esc(META.groups[k].label)}（${META.groups[k].size}${k === "beginner" ? "種" : "型"}）：${esc(META.groups[k].def)}</li>`).join("");
    let extra;
    if (sliderVariant === "run3") {
      extra = `<li>初心者グループは実在プレイヤーのデータではなく、生成した簡易型24種（攻撃技のみ・テンプレ配分・通常フォルム）との対戦結果です。各最終候補がその24種それぞれと200戦し、両者ともobsh3が操作しています（数値は24種への平均スコア）。</li>` +
        `<li>オリジナル／上級者への勝率は、run3決勝総当たり（各300試合・obsh3同士）の行列をグループごとに集計したものです。メタ群は、同じ技構成のファミリーが4型以上という運用定義では空です（決勝168型の技構成は165種類で、最大ファミリーでも2型）。上級者とオリジナルで最終候補168型を分割しています。</li>` +
        `<li>対象はrun3（全68技の範囲）のデータです。決勝に残らなかった型や、自由に入力した型の期待勝率はここでは計算できません。</li>`;
    } else {
      extra = `<li>初心者グループは実在プレイヤーのデータではなく、生成した簡易型24種（攻撃技のみ・テンプレ配分・通常フォルム）との対戦結果です。各最終候補がその24種それぞれと200戦し、両者とも学習方策g12が操作しています（勝率は W/(W+L+D)）。</li>` +
        `<li>メタ／オリジナル／上級者への勝率は、run2決勝総当たり（各300試合・学習方策g12同士）の行列をグループごとに集計したものです。上級者はメタ・オリジナルと重ならないよう除いて数えています（3グループで最終候補168型を分割）。</li>` +
        `<li>対象はrun2（注目17技の範囲）のデータです。17技の外の型や、自由に入力した型の期待勝率はここでは計算できません。</li>`;
    }
    groupSection = `<div><h4>相手分布のグループ定義と注意</h4><ul>${items}${extra}` +
      `<li>プリセットの数字は 初心者/メタ/オリジナル/上級者 の順です。${sliderVariant === "run3"
        ? "「従来の総当たり」は最終候補168型のグループ比（オリジナル148・上級者20、メタ0、初心者0）です。"
        : "「従来の総当たり」は最終候補168型のグループ比（メタ55・オリジナル73・上級者40、初心者0）です。"}</li></ul></div>`;
  }
  const findings = [];
  if (isRun3) findings.push(`<li>じしんは${eqCount}/${builds.length}型が採用。一方、run1・run2では全型が採用したシャドーボールは${sbCount}型にとどまり、68技では採用の中心が移りました。</li>`);
  else findings.push(`<li>決勝に残った${builds.length}型すべてがシャドーボールを採用（${sbCount}/${builds.length}）。特殊受け系統への回答として必須級でした。</li>`);
  findings.push(`<li>総合上位10型のうち${topArchCount}型が「${esc(topArchetype)}」系統${isRun2 || isRun3 ? "です" : "（S152ライン＋じしん＋シャドーボール）"}。</li>`);
  if (isRun3) findings.push(`<li>決勝総当たりの中で、最悪マッチアップ勝率が0.30以上ある型は0型でした（run2でも0型）。最も浅い型でも最悪${pct(shallowestWorst)}（総当たり${shallowestRank}位）で、68技に広げても単一の最強は存在しませんでした。</li>`);
  else if (isRun2) findings.push(`<li>決勝総当たりの中で、最悪マッチアップ勝率が0.30以上ある型は0型でした（run1では0.35以上が3型）。最も浅い型でも最悪${pct(shallowestWorst)}で、正しい評価では三すくみがより鮮明になっています。</li>`);
  else findings.push(`<li>決勝総当たりの中では、最悪マッチアップ勝率が0.35以上あるのは${robust.length}型だけです（基準プールは含みません。プールにはへるぴん型のような天敵がいて、プール込みの最悪値は全型とも大きく下がります）。</li>`);
  if (first && first.vsPool.some((v) => v[0] === "せつない型")) {
    const v = first.vsPool.find((x) => x[0] === "せつない型");
    findings.push(`<li>総合1位（#${first.rank}）は基準プールのせつない型に${pct(v ? v[1] : 0)}と大きく負けます。1位が絶対ではありません。</li>`);
  }
  if (bestNormal) findings.push(`<li>通常フォルムの最上位は#${bestNormal.rank}（平均${pct(bestNormal.rrAvg)}）。メガ勢との差がはっきり出ました。</li>`);
  for (const n of run.notes) findings.push(`<li>${esc(n)}</li>`);
  const caution = isRun3
    ? "注意：全型をobsh3（観測v2ヒューリスティクス＝未学習の事前方策）が操縦した結果です。run2の学習方策g12とは操縦者が異なるため、順位をrun2とそのまま比べることはできません。勝率は決勝総当たり各300試合の実測値です。run3は決勝進出型同士の対戦のみを集計し、基準プールへの勝率は測っていません。"
    : isRun2
      ? "注意：全型を学習方策g12（観測できる情報のみで判断する学習モデル）が操縦した結果です。run1の汎用方針（全情報ヒューリスティクス）とは操縦者が異なるため、順位をrun1とそのまま比べることはできません。勝率は決勝総当たり各300試合の実測値です。run2は決勝進出型同士の対戦のみを集計し、基準プールへの勝率は測っていません。"
      : "注意：全型を汎用方針（ヒューリスティクス）が操縦した結果です。最終評価は学習モデルによる再評価が前提で、順位は変わり得ます。勝率は決勝総当たり・基準プールとも各300試合の実測値です。";
  return `<details class="fold"><summary>データ仕様・用語の解説</summary><div class="fold-body">` +
    `<div><h4>用語</h4><ul>` +
    `<li>期待勝率：相手分布スライダーで想定した出現割合に対する勝率の期待値。Σ（各グループの割合 × そのグループへの勝率）で計算します。表示されているスライダーの数値そのものが分布で、合計は常に100%です。</li>` +
    `<li>最悪の相性：その型が最も苦手な相手。KPIカードでは決勝の上位20型の中で最も勝率が低い相手を、ランキング表では4グループの中で最も勝率が低いグループを示します。</li>` +
    `<li>想定順位：現在の相手分布で全${builds.length}型を期待勝率順に並べたときの、評価中の型の位置です。</li></ul></div>` +
    groupSection +
    `<div><h4>${esc(run.title)}（${esc(run.date)} ・ 対象：${esc(run.species)}同種ミラー）の仕様と所見</h4>` +
    `<p>${esc(run.method)}</p>` +
    `<p style="font-weight:700">「最強の1型」は決まらなかったため、勝ち上がった型を候補として並べています。平均勝率が高い型にも明確な天敵がいて、三すくみになっています。使う場面に合わせて候補から選ぶ前提の結果です。</p>` +
    `<ul>${findings.join("")}</ul><p class="fine">${caution}</p></div>` +
    `</div></details>`;
}

/* ---------- main render ---------- */
function renderRunSeg() {
  const seg = document.getElementById("runSeg");
  const titles = { run1: "run1（汎用方針・17技）", run2: "run2（学習方策g12・17技）", run3: "run3（obsh3・68技）" };
  seg.innerHTML = ["run1", "run2", "run3"].map((k) =>
    `<button type="button" data-run="${k}" aria-pressed="${runKey === k}" title="${titles[k]}">${k}</button>`).join("");
  seg.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => { runKey = btn.dataset.run; renderApp(); });
  });
}
function wirePickups(run) {
  const box = document.getElementById("matrix-box");
  if (box) {
    box.addEventListener("click", (e) => {
      const btn = e.target.closest("button.cell");
      if (!btn) return;
      matrixState[run.key] = { i: Number(btn.dataset.mi), j: Number(btn.dataset.mj) };
      box.innerHTML = matrixHtml(run);
    });
  }
  document.querySelectorAll("button[data-arch]").forEach((btn) => {
    btn.addEventListener("click", () => { pickupState.arch = btn.dataset.arch; renderApp(); });
  });
  document.querySelectorAll("button[data-sortmode]").forEach((btn) => {
    btn.addEventListener("click", () => { pickupState.sortMode = btn.dataset.sortmode; renderApp(); });
  });
}
function renderApp() {
  renderRunSeg();
  const app = document.getElementById("app");
  const fold = document.getElementById("fold");
  const run = DATA.runs[runKey];
  if (runKey === "run1") {
    app.innerHTML = `<div class="noslider-note" style="margin-top:1.5rem"><h3 class="sec">run1（汎用方針・17技）</h3>` +
      `<p style="margin:0.25rem 0 0;color:var(--dim)">run1は基準プール方式の結果で、相手分布スライダーの対象外です。下に候補ピックアップと決勝168型の全候補を表示します。分布で評価する場合は run2 / run3 に切り替えてください。</p></div>` +
      renderPickups(run, true);
    fold.innerHTML = renderFold(run, null);
  } else {
    app.innerHTML = renderEvaluator(runKey) + `<div id="pickups-box">${renderPickups(run, false)}</div>`;
    wireEvaluator(runKey);
    updateEvaluator(runKey);
    fold.innerHTML = renderFold(run, runKey);
  }
  wirePickups(run);
}
renderApp();
</script>
