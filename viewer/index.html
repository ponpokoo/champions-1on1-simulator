function syncJobPollingTimer() {
  const active = APP.jobs.some((x) => x.status === "generating" || x.status === "running");
  if (active && !APP.jobTimer) APP.jobTimer = setInterval(pollJobsOnce, 800);
  else if (!active && APP.jobTimer) { clearInterval(APP.jobTimer); APP.jobTimer = null; }
}

async function pollJobsOnce() {
  if (!APP.serverOk) return;
  try {
    const prev = { ...APP.search.lastJobStatuses };
    const [j, r] = await Promise.all([apiGet("/api/search/jobs"), apiGet("/api/runs")]);
    APP.jobs = j.jobs || [];
    APP.runs = r.runs || [];
    let completedRun = null;
    for (const job of APP.jobs) {
      const wasActive = prev[job.run] === "generating" || prev[job.run] === "running";
      if (wasActive && job.status === "complete") {
        completedRun = job.run;
        APP.search.recentNotice = { run: job.run, species: job.species };
        document.title = `✓ 完了: ${job.run} | Champions 1on1 Studio`;
        toast(`🎉 探索「${job.run}」が完了しました！`, "good");
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          try { new Notification("探索が完了しました", { body: `${job.run}（${spName(job.species)} / ${job.tier}）` }); } catch (_) {}
        }
        if (APP.activeTab === "search") renderSearchTab();
      } else if (wasActive && job.status === "error") {
        document.title = `⚠ エラー: ${job.run} | Champions 1on1 Studio`;
        toast(`探索「${job.run}」でエラーが発生しました`, "bad");
      }
      APP.search.lastJobStatuses[job.run] = job.status;
    }
    syncPoolRunDefault();
    syncJobPollingTimer();
    updateNavBadges();
    if (APP.activeTab === "search") updateSearchJobsDom();
    if (completedRun && APP.runs.some((x) => x.run === completedRun && x.hasResults)) {
      await loadRunIntoViewer(completedRun);
      if (APP.activeTab === "battle") renderBattleTab();
    } else if (!APP.viewer.selectedRun) {
      const completed = APP.runs.filter((x) => x.hasResults);
      if (completed.length) await loadRunIntoViewer(completed[0].run);
    } else {
      const cur = APP.runs.find((x) => x.run === APP.viewer.selectedRun);
      if (cur && cur.hasResults && cur.mtime > (APP.viewer.loadedMtime || 0)) {
        await loadRunIntoViewer(cur.run);
      }
    }
  } catch (_) {}
}

});

/* ---------- Tab 3: Result Analysis Viewer ---------- */
function analyzeResults(raw) {
  const finalists = raw?.finalists;
  const matrix = raw?.matrix;
  if (!Array.isArray(finalists) || !finalists.length) throw new Error("finals_results.json に finalists が含まれていません");
  const n = finalists.length;
  if (!Array.isArray(matrix) || matrix.length !== n) throw new Error(`matrix のサイズが finalists (${n}) と一致しません`);

  const statsBoth = [], statsSeatA = [];
  for (let i = 0; i < n; i++) {
    let sumB = 0, cntB = 0, worstB = 1, worstBIdx = -1;
    let sumA = 0, cntA = 0, worstA = 1, worstAIdx = -1;
    const rowBoth = [];
    for (let j = 0; j < n; j++) {
      const sa = matrix[i]?.[j] ?? 0.5;
      sumA += sa; cntA++;
      if (sa < worstA) { worstA = sa; worstAIdx = j; }
      if (i !== j) {
        const sb = 1 - (matrix[j]?.[i] ?? 0.5);
        const b = 0.5 * (sa + sb);
        rowBoth.push(b); sumB += b; cntB++;
        if (b < worstB) { worstB = b; worstBIdx = j; }
      } else {
        rowBoth.push(0.5);
      }
    }
    statsBoth.push({ idx: i, mean: cntB ? sumB / cntB : 0.5, worst: cntB ? worstB : 0.5, worstOppIdx: worstBIdx, row: rowBoth });
    statsSeatA.push({ idx: i, mean: cntA ? sumA / cntA : 0.5, worst: cntA ? worstA : 0.5, worstOppIdx: worstAIdx, row: matrix[i] || [] });
  }

  const decoded = finalists.map((spec, idx) => ({ ...decodeBuildSummary(spec), origIdx: idx, spec }));
  const seatAOrder = [...statsSeatA].sort((a, b) => b.mean - a.mean || b.worst - a.worst || a.idx - b.idx);
  const bothOrder = [...statsBoth].sort((a, b) => b.mean - a.mean || b.worst - a.worst || a.idx - b.idx);
  const rankA = new Array(n); seatAOrder.forEach((s, r) => { rankA[s.idx] = r + 1; });
  const rankB = new Array(n); bothOrder.forEach((s, r) => { rankB[s.idx] = r + 1; });

  const moveCounts = new Map();
  decoded.forEach((d) => moveCounts.set(d.movesSortedKey, (moveCounts.get(d.movesSortedKey) || 0) + 1));
  const top1BothIdx = bothOrder[0]?.idx ?? 0;
  const top20Both = new Set(bothOrder.slice(0, Math.min(20, n)).map((x) => x.idx));
  const begList = raw.beginner_scores?.per_finalist || null;

  const groupMap = { meta: [], original: [], advanced: [] };
  decoded.forEach((d, i) => {
    const vs1 = statsBoth[i].row[top1BothIdx] ?? 0;
    let grp = "original";
    if (top20Both.has(i) || (i !== top1BothIdx && vs1 >= 0.6)) grp = "advanced";
    else if ((moveCounts.get(d.movesSortedKey) || 0) >= 4) grp = "meta";
    d.group = grp;
    groupMap[grp].push(i);
  });

  const builds = decoded.map((d, i) => {
    const avgOf = (indices, modeStats) => {
      const opp = indices.filter((j) => j !== i);
      if (!opp.length) return null;
      return opp.reduce((s, j) => s + (modeStats[i].row[j] ?? 0.5), 0) / opp.length;
    };
    return {
      ...d,
      rankBoth: rankB[i], rankA: rankA[i],
      both: statsBoth[i], seatA: statsSeatA[i],
      rateBoth: { beginner: begList ? begList[i] : null, meta: avgOf(groupMap.meta, statsBoth), original: avgOf(groupMap.original, statsBoth), advanced: avgOf(groupMap.advanced, statsBoth) },
      rateA: { beginner: begList ? begList[i] : null, meta: avgOf(groupMap.meta, statsSeatA), original: avgOf(groupMap.original, statsSeatA), advanced: avgOf(groupMap.advanced, statsSeatA) },
    };
  });

  const mvFreq = new Map(), itFreq = new Map(), mgFreq = new Map();
  builds.forEach((b) => {
    b.moves.forEach((m) => mvFreq.set(m, (mvFreq.get(m) || 0) + 1));
    itFreq.set(b.item, (itFreq.get(b.item) || 0) + 1);
    mgFreq.set(b.mega, (mgFreq.get(b.mega) || 0) + 1);
  });

  return {
    species: raw.species || builds[0]?.species || "",
    tier: raw.tier || raw.summary?.tier || "",
    tierLabel: raw.tier_label || raw.summary?.tier_label || "",
    policy: raw.policy || "obsh4",
    gamesPerPair: raw.finals_games_per_pair || raw.summary?.finals_games_per_pair || "?",
    totalCandidates: raw.total_candidates || raw.candidates_meta?.total || raw.summary?.candidates || "?",
    filters: raw.filters || raw.candidates_meta?.filters || null,
    enumMode: raw.enumeration_mode || raw.candidates_meta?.enumeration_mode || null,
    hasBeginner: Boolean(begList),
    groupSizes: { beginner: raw.beginner_scores?.pool_size || 0, meta: groupMap.meta.length, original: groupMap.original.length, advanced: groupMap.advanced.length },
    builds, bothOrder, seatAOrder,
    mvFreq: [...mvFreq.entries()].sort((a, b) => b[1] - a[1]),
    itFreq: [...itFreq.entries()].sort((a, b) => b[1] - a[1]),
    mgFreq: [...mgFreq.entries()].sort((a, b) => b[1] - a[1]),
  };
}

function activeViewerGroups(parsed) {
  const keys = [];
  if (parsed.hasBeginner) keys.push("beginner");
  ["meta", "original", "advanced"].forEach((k) => { if (parsed.groupSizes[k] > 0) keys.push(k); });
  return keys;
}

function setViewerData(raw) {
  const parsed = analyzeResults(raw);
  APP.viewer.raw = raw; APP.viewer.parsed = parsed;
  const active = activeViewerGroups(parsed);
  const eq = Math.floor(100 / active.length);
  const w = { beginner: 0, meta: 0, original: 0, advanced: 0 };
  active.forEach((k, idx) => { w[k] = idx === 0 ? 100 - eq * (active.length - 1) : eq; });
  APP.viewer.weights = w;
  APP.viewer.selectedCell = { i: 0, j: Math.min(1, parsed.builds.length - 1) };
  APP.viewer.listFilter = { move: "", item: "", group: "all", q: "" };
}

async function loadRunIntoViewer(runName) {
  APP.viewer.error = null; APP.viewer.selectedRun = runName;
  const meta = APP.runs.find((x) => x.run === runName);
  try {
    setViewerData(await apiGet(`/api/runs/${encodeURIComponent(runName)}`));
    APP.viewer.loadedMtime = meta?.mtime || Date.now() / 1000;
  }
  catch (err) { APP.viewer.error = err.message; }
  renderViewerTab();
}

function setLinkedWeight(parsed, key, rawVal) {
  const active = activeViewerGroups(parsed);
  const prev = APP.viewer.weights;
  const others = active.filter((k) => k !== key);
  const othersTotal = others.reduce((s, k) => s + (prev[k] || 0), 0);
  const value = Math.max(0, Math.min(100, Math.round(rawVal), (prev[key] || 0) + othersTotal));
  const delta = value - (prev[key] || 0);
  const next = { ...prev, [key]: value };
  if (delta !== 0 && others.length > 0) {
    const amt = Math.abs(delta);
    const parts = others.map((k) => othersTotal > 0 ? (amt * (prev[k] || 0)) / othersTotal : amt / others.length);
    const ints = parts.map((p) => Math.floor(p));
    let rem = amt - ints.reduce((a, b) => a + b, 0);
    const bySize = others.map((k, i) => ({ k, i })).sort((a, z) => (prev[z.k] || 0) - (prev[a.k] || 0));
    for (const t of bySize) { if (rem <= 0) break; ints[t.i]++; rem--; }
    others.forEach((k, i) => { next[k] = delta > 0 ? (prev[k] || 0) - ints[i] : (prev[k] || 0) + ints[i]; });
  }
  APP.viewer.weights = next;
}

function computeViewerTableRows(p) {
  const st = APP.viewer;
  const mode = st.seatMode;
  const activeKeys = activeViewerGroups(p);
  const rankedExpected = p.builds.map((b) => {
    const rMap = mode === "both" ? b.rateBoth : b.rateA;
    let totalW = 0, expected = 0;
    activeKeys.forEach((k) => {
      const w = st.weights[k] || 0;
      const val = rMap[k];
      if (val !== null && val !== undefined) { totalW += w; expected += w * val; }
    });
    const mStats = mode === "both" ? b.both : b.seatA;
    expected = totalW > 0 ? expected / totalW : mStats.mean;
    return { b, expected, mStats };
  }).sort((a, z) => z.expected - a.expected || (mode === "both" ? a.b.rankBoth - z.b.rankBoth : a.b.rankA - z.b.rankA));

  let rows = rankedExpected.map((x, idx) => ({ ...x, expPos: idx + 1 }));
  if (st.listFilter.group !== "all") rows = rows.filter((x) => x.b.group === st.listFilter.group);
  if (st.listFilter.move) rows = rows.filter((x) => x.b.moves.includes(st.listFilter.move));
  if (st.listFilter.item) rows = rows.filter((x) => x.b.item === st.listFilter.item);
  if (st.listFilter.q) {
    const q = st.listFilter.q.trim().toLowerCase();
    rows = rows.filter((x) => {
      const txt = `${x.b.formLabel} ${itName(x.b.item)} ${abName(x.b.ability)} ${x.b.nat.name} ${x.b.moves.map(mvName).join(" ")}`.toLowerCase();
      return txt.includes(q);
    });
  }
  const sKey = st.sort.key, sSign = st.sort.dir === "asc" ? 1 : -1;
  rows.sort((a, z) => {
    const va = sKey === "expected" ? a.expected : sKey === "rr" ? a.mStats.mean : a.mStats.worst;
    const vz = sKey === "expected" ? z.expected : sKey === "rr" ? z.mStats.mean : z.mStats.worst;
    return sSign * (va - vz) || a.expPos - z.expPos;
  });
  return rows;
}

    <td class="${rateCls(mStats.worst)} tnum">${pct(mStats.worst)}</td>
    <td><b>${esc(b.formLabel)}</b><br><span class="xs dim">${esc(itName(b.item))} · ${esc(abName(b.ability))} · ${esc(b.nat.short)}</span></td>

}

function wireViewerSendButtons(scope) {
  scope.querySelectorAll("[data-send-build]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const side = btn.dataset.sendBuild;
      APP.battle[side] = reconcileBuild(parseSpec(btn.dataset.spec));
      const other = side === "A" ? "B" : "A";
      if (APP.battle[other].species !== APP.battle[side].species) {
        APP.battle[other] = reconcileBuild(parseSpec(btn.dataset.spec));
      }
      syncPoolRunDefault();
      switchTab("battle");
      toast(`型 ${side} に読み込みました`, "info");
    });
  });
}

function refreshViewerExpected(root) {
  const st = APP.viewer;
  const p = st.parsed;
  if (!p) return;
  activeViewerGroups(p).forEach((k) => {
    const pctEl = root.querySelector(`[data-dist-pct="${k}"]`);
    if (pctEl) pctEl.innerHTML = `<b>${st.weights[k]}%</b>`;
    const slider = root.querySelector(`[data-dist-slider="${k}"]`);
    if (slider && document.activeElement !== slider) slider.value = String(st.weights[k]);
    const seg = root.querySelector(`[data-mix-seg="${k}"]`);
    if (seg) seg.style.width = `${st.weights[k]}%`;
  });
  const rows = computeViewerTableRows(p);
  const cnt = document.getElementById("viewerTblCount");
  if (cnt) cnt.textContent = `${rows.length} 件表示`;
  const tbody = document.getElementById("viewerTblBody");
  if (tbody) {
    tbody.innerHTML = renderViewerTableBodyHtml(rows, st.seatMode);
    wireViewerSendButtons(tbody);
  }
}

function renderViewerTab() {

          <select id="selViewerRun" style="min-width:240px">
            <option value="">（選択してください）</option>
            ${completedRuns.map((r) => `<option value="${esc(r.run)}" ${r.run === st.selectedRun ? "selected" : ""}>${esc(r.run)} — ${esc(spName(r.species))} (${esc(r.tierLabel || r.tier)})</option>`).join("")}
          </select>
          <button type="button" class="btn sm ghost" id="btnViewerReload">更新</button>
        ` : `<span class="small dim">静的閲覧モード：右の枠からローカルの <span class="mono">finals_results.json</span> を開けます</span>`}
      </div>
      <label class="dropzone" id="viewerDrop">
        <span>📂 <span class="mono">finals_results.json</span> を開く（D&D 対応）</span>
        <input type="file" id="inViewerFile" accept=".json" hidden />
      </label>
    </div>
    ${st.error ? `<div class="callout bad" style="margin-top:0.6rem">${esc(st.error)}</div>` : ""}
  </section>`;

  if (!st.parsed) {
    el.innerHTML = selectorBar + `<section class="card" style="text-align:center; padding:2.5rem 1rem">
      <h3 style="margin:0 0 0.4rem">表示する探索結果がありません</h3>
      <p class="small dim" style="margin:0">タブ 2「種族探索」で探索を実行するか、既存の <span class="mono">finals_results.json</span> を上にドロップしてください。</p>
    </section>`;
    wireViewerEvents();
    return;
  }

  const p = st.parsed;
  const mode = st.seatMode;
  const activeKeys = activeViewerGroups(p);
  const groupLabels = { beginner: "初心者（簡易24種）", meta: "メタ", original: "オリジナル", advanced: "上級者" };
  const order = mode === "both" ? p.bothOrder : p.seatAOrder;
  const topOrdered = order.map((x) => p.builds[x.idx]);
  const top10 = topOrdered.slice(0, 10);
  const shallowest3 = [...p.builds].sort((a, b) => (mode === "both" ? b.both.worst - a.both.worst : b.seatA.worst - a.seatA.worst)).slice(0, 3);
  const top1 = topOrdered[0];
  const counters = top1 ? p.builds
    .filter((b) => b.origIdx !== top1.origIdx && ((mode === "both" ? b.both.row[top1.origIdx] : b.seatA.row[top1.origIdx]) > 0.5))
    .sort((a, b) => (mode === "both" ? b.both.row[top1.origIdx] - a.both.row[top1.origIdx] : b.seatA.row[top1.origIdx] - a.seatA.row[top1.origIdx]))
    .slice(0, 3) : [];

  const showcaseItems = st.showcaseView === "shallow" ? shallowest3 : st.showcaseView === "counter" ? counters : top10;
  const top20 = topOrdered.slice(0, Math.min(20, topOrdered.length));
  const selCell = { i: Math.min(st.selectedCell.i, top20.length - 1), j: Math.min(st.selectedCell.j, top20.length - 1) };
  let matrixCells = `<span></span>` + top20.map((b) => `<span class="mh">#${mode === "both" ? b.rankBoth : b.rankA}</span>`).join("");
  top20.forEach((rb, i) => {
    matrixCells += `<span class="mr">#${mode === "both" ? rb.rankBoth : rb.rankA}</span>`;
    top20.forEach((cb, j) => {
      const r = mode === "both" ? rb.both.row[cb.origIdx] : rb.seatA.row[cb.origIdx];
      const cls = r >= 0.65 ? "cell-1" : r >= 0.55 ? "cell-2" : r >= 0.5 ? "cell-3" : r >= 0.45 ? "cell-4" : r >= 0.35 ? "cell-5" : "cell-6";
      matrixCells += `<button type="button" class="cell ${cls}${i === selCell.i && j === selCell.j ? " active" : ""}" data-cell-i="${i}" data-cell-j="${j}">${Math.round(r * 100)}</button>`;
    });
  });
  const cellRowB = top20[selCell.i], cellColB = top20[selCell.j];
  const cellRate = cellRowB && cellColB ? (mode === "both" ? cellRowB.both.row[cellColB.origIdx] : cellRowB.seatA.row[cellColB.origIdx]) : 0.5;
  const tableRows = computeViewerTableRows(p);
  const filterDesc = p.filters ? Object.entries(p.filters).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(" · ") : "無制約（種族全体）";

  el.innerHTML = selectorBar + `
    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title" style="font-size:1.25rem">${esc(spName(p.species))} <span class="xs mono dim">${esc(p.species)}</span> 探索レポート</h2>
          <div class="row" style="margin-top:0.35rem; gap:0.35rem">
            <span class="badge acc">${esc(p.tierLabel || p.tier)}</span>
            <span class="badge">方針 ${esc(p.policy)}</span>
            <span class="badge tnum">候補 ${esc(String(p.totalCandidates))} → 決勝 ${p.builds.length}（各${esc(String(p.gamesPerPair))}戦）</span>
            ${p.enumMode ? `<span class="badge">${esc(p.enumMode)}</span>` : ""}
          </div>
          <p class="xs dim" style="margin:0.3rem 0 0">絞り込み：${esc(filterDesc)}</p>
        </div>
        <div class="row">
          <div class="seg" role="group">
            <button type="button" data-seat-mode="both" aria-pressed="${mode === "both"}">両席合算（ミラー除外）</button>
            <button type="button" data-seat-mode="seatA" aria-pressed="${mode === "seatA"}">A 席基準</button>
          </div>
          <button type="button" class="help-dot" data-help="seat" title="両席合算とA席基準">?</button>
          ${APP.serverOk && st.selectedRun ? `<button type="button" class="btn sm ghost" id="btnBeginnerEval" ${st.beginnerBusy ? "disabled" : ""}>${p.hasBeginner ? "初心者プール再計測" : "初心者プール(24種)計測"}</button>` : ""}
        </div>
      </div>

      <div class="grid-2">
        <div class="card-sub">
          <div class="row" style="justify-content:space-between">
            <b class="small">想定する相手の環境比率 <button type="button" class="help-dot" data-help="groups" title="環境グループとスライダー">?</button></b>
            <div class="row" style="gap:0.25rem">
              <button type="button" class="btn xs ghost" data-dist-preset="equal">均等</button>
              <button type="button" class="btn xs ghost" data-dist-preset="adv">上級者重視</button>
              <button type="button" class="btn xs ghost" data-dist-preset="rr">決勝比率</button>
            </div>
          </div>
          <div class="mix-bar">
            ${activeKeys.map((k) => `<span class="mix-${k}" data-mix-seg="${k}" style="width:${st.weights[k]}%"></span>`).join("")}
          </div>
          ${activeKeys.map((k) => `
            <div style="margin-top:0.38rem">
              <div class="row" style="justify-content:space-between; font-size:0.8rem">
                <span><b>${esc(groupLabels[k])}</b> <span class="xs dim">(${p.groupSizes[k]}型)</span></span>
                <span class="mono tnum" data-dist-pct="${k}"><b>${st.weights[k]}%</b></span>
              </div>
              <input type="range" min="0" max="100" value="${st.weights[k]}" data-dist-slider="${k}" style="width:100%; accent-color:var(--accent)" />
            </div>
          `).join("")}
        </div>

        <div class="card-sub">
          <b class="small" style="display:block; margin-bottom:0.45rem">決勝 ${p.builds.length} 型内の採用トレンド</b>
          <div class="grid-2" style="gap:0.75rem">
            <div>
              <span class="xs dim" style="font-weight:700">採用技 Top 8</span>
              ${p.mvFreq.slice(0, 8).map(([m, c]) => `<div class="winbar" style="margin-top:0.22rem"><span class="wl" style="width:6.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(mvName(m))}</span><span class="wt"><span class="wf" style="width:${Math.round((c / p.builds.length) * 100)}%; background:var(--accent)"></span></span><span class="wv" style="width:2rem">${c}</span></div>`).join("")}
            </div>
            <div>
              <span class="xs dim" style="font-weight:700">持ち物 Top 6</span>
              ${p.itFreq.slice(0, 6).map(([it, c]) => `<div class="winbar" style="margin-top:0.22rem"><span class="wl" style="width:6.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(itName(it))}</span><span class="wt"><span class="wf" style="width:${Math.round((c / p.builds.length) * 100)}%; background:var(--good)"></span></span><span class="wv" style="width:2rem">${c}</span></div>`).join("")}
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 class="card-title">注目候補ピック</h3>
        <div class="seg" role="group">
          <button type="button" data-showcase="top10" aria-pressed="${st.showcaseView === "top10"}">総合上位 (${top10.length})</button>
          <button type="button" data-showcase="shallow" aria-pressed="${st.showcaseView === "shallow"}">安定型 Top ${shallowest3.length}</button>
          <button type="button" data-showcase="counter" aria-pressed="${st.showcaseView === "counter"}">1位対策 (${counters.length})</button>
        </div>
      </div>
      <div class="build-cards">
        ${showcaseItems.length
          ? showcaseItems.map((b) => renderViewerCard(b, mode, st.showcaseView === "shallow" ? "最悪相性が浅い" : st.showcaseView === "counter" && top1 ? `1位へ ${pct(mode === "both" ? b.both.row[top1.origIdx] : b.seatA.row[top1.origIdx])}` : "")).join("")
          : `<p class="small dim" style="margin:0">該当する型はありません。</p>`}
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 class="card-title">上位 ${top20.length} 型 総当たり勝率ヒートマップ</h3>
        <div class="row xs dim">
          <span class="badge" style="background:#2563eb;color:#fff;border:0">65%+</span>
          <span class="badge" style="background:color-mix(in srgb,#2563eb 58%,var(--surface-3));border:0">55%+</span>
          <span class="badge" style="background:var(--surface-3);border:0">45〜49%</span>
          <span class="badge" style="background:color-mix(in srgb,#ef4444 65%,var(--surface-3));color:#fff;border:0">&lt;35%</span>
        </div>
      </div>
      <div class="matrix-wrap">
        <div class="matrix-grid" style="grid-template-columns:2.2rem repeat(${top20.length}, minmax(22px, 1fr))">${matrixCells}</div>
      </div>
      ${cellRowB && cellColB ? `<div class="card-sub row" style="justify-content:space-between; margin-top:0.7rem">
        <span><b>#${mode === "both" ? cellRowB.rankBoth : cellRowB.rankA}</b>（${esc(cellRowB.moves.map(mvName).join(" / "))}） vs <b>#${mode === "both" ? cellColB.rankBoth : cellColB.rankA}</b>（${esc(cellColB.moves.map(mvName).join(" / "))}）：<span class="${rateCls(cellRate)} tnum">${pct(cellRate)}</span></span>
        <button type="button" class="btn sm primary" id="btnSendPairToBattle">この 2 型を自作型テストへ送る</button>
      </div>` : ""}
    </section>

    <section class="card">
      <div class="card-head">
        <h3 class="card-title">決勝全 ${p.builds.length} 型ランキング <span class="badge" id="viewerTblCount">${tableRows.length} 件表示</span></h3>
        <div class="row">
          <input type="search" id="inListSearch" placeholder="技・持ち物・特性・性格で検索" value="${esc(st.listFilter.q)}" style="width:190px" />
          <select id="selListGrp">
            <option value="all">グループ：すべて</option>
            ${["meta", "original", "advanced"].filter((g) => p.groupSizes[g] > 0).map((g) => `<option value="${g}" ${st.listFilter.group === g ? "selected" : ""}>${groupLabels[g]}</option>`).join("")}
          </select>
          <select id="selListMv">
            <option value="">技：すべて</option>
            ${p.mvFreq.map(([m, c]) => `<option value="${esc(m)}" ${st.listFilter.move === m ? "selected" : ""}>${esc(mvName(m))} (${c})</option>`).join("")}
          </select>
          <select id="selListIt">
            <option value="">持ち物：すべて</option>
            ${p.itFreq.map(([it, c]) => `<option value="${esc(it)}" ${st.listFilter.item === it ? "selected" : ""}>${esc(itName(it))} (${c})</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr>
            <th><button type="button" class="btn xs ghost" data-vsort="expected">期待勝率 ${st.sort.key === "expected" ? (st.sort.dir === "desc" ? "▼" : "▲") : ""}</button></th>
            <th><button type="button" class="btn xs ghost" data-vsort="rr">決勝平均 ${st.sort.key === "rr" ? (st.sort.dir === "desc" ? "▼" : "▲") : ""}</button></th>
            <th><button type="button" class="btn xs ghost" data-vsort="worst">最悪相性 ${st.sort.key === "worst" ? (st.sort.dir === "desc" ? "▼" : "▲") : ""}</button></th>
            <th>フォルム・持ち物</th><th>SP / 実数値</th><th>技構成</th><th>比較へ</th>
          </tr></thead>
          <tbody id="viewerTblBody">${renderViewerTableBodyHtml(tableRows, mode)}</tbody>
        </table>
      </div>
    </section>
  `;

  wireViewerEvents(top20, selCell);
}

function wireViewerEvents(top20 = [], selCell = { i: 0, j: 0 }) {
  const root = document.getElementById("tab-viewer");
  const st = APP.viewer;

  document.getElementById("selViewerRun")?.addEventListener("change", (e) => { if (e.target.value) loadRunIntoViewer(e.target.value); });
  document.getElementById("btnViewerReload")?.addEventListener("click", refreshServerState);

  const handleFile = async (file) => {
    if (!file) return;
    try { setViewerData(JSON.parse(await file.text())); st.selectedRun = ""; st.error = null; toast(`${file.name} を読み込みました`, "good"); }
    catch (err) { st.error = `JSON 読込エラー: ${err.message}`; }
    renderViewerTab();
  };
  document.getElementById("inViewerFile")?.addEventListener("change", (e) => handleFile(e.target.files?.[0]));
  const dz = document.getElementById("viewerDrop");
  if (dz) {
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag"); handleFile(e.dataTransfer?.files?.[0]); });
  }

  root.querySelectorAll("[data-seat-mode]").forEach((btn) => btn.addEventListener("click", () => { st.seatMode = btn.dataset.seatMode; renderViewerTab(); }));
  root.querySelectorAll("[data-showcase]").forEach((btn) => btn.addEventListener("click", () => { st.showcaseView = btn.dataset.showcase; renderViewerTab(); }));

  document.getElementById("btnBeginnerEval")?.addEventListener("click", async () => {
    st.beginnerBusy = true; st.error = null; renderViewerTab();
    try { await apiPost("/api/search/beginner_eval", { run: st.selectedRun, games: 50 }); await loadRunIntoViewer(st.selectedRun); toast("初心者プールの計測が完了しました", "good"); }
    catch (err) { st.error = err.message; }
    finally { st.beginnerBusy = false; renderViewerTab(); }
  });

  root.querySelectorAll("[data-dist-slider]").forEach((inp) => inp.addEventListener("input", (e) => {
    setLinkedWeight(st.parsed, e.target.dataset.distSlider, Number(e.target.value));
    refreshViewerExpected(root);
  }));
  root.querySelectorAll("[data-dist-preset]").forEach((btn) => btn.addEventListener("click", () => {
    const p = st.parsed; const active = activeViewerGroups(p);
    const w = { beginner: 0, meta: 0, original: 0, advanced: 0 };
    if (btn.dataset.distPreset === "equal") {
      const q = Math.floor(100 / active.length);
      active.forEach((k, i) => { w[k] = i === 0 ? 100 - q * (active.length - 1) : q; });
    } else if (btn.dataset.distPreset === "adv" && p.groupSizes.advanced > 0) {
      w.advanced = 60;
      const rest = active.filter((k) => k !== "advanced");
      const q = rest.length ? Math.floor(40 / rest.length) : 0;
      rest.forEach((k, i) => { w[k] = i === 0 ? 40 - q * (rest.length - 1) : q; });
    } else {
      const fin = ["meta", "original", "advanced"].filter((k) => p.groupSizes[k] > 0);
      const tot = fin.reduce((s, k) => s + p.groupSizes[k], 0);
      let acc = 0;
      fin.forEach((k, i) => { w[k] = i === fin.length - 1 ? 100 - acc : Math.round((p.groupSizes[k] / tot) * 100); acc += w[k]; });
    }
    st.weights = w; renderViewerTab();
  }));

  root.querySelectorAll("[data-cell-i]").forEach((btn) => btn.addEventListener("click", () => {
    st.selectedCell = { i: Number(btn.dataset.cellI), j: Number(btn.dataset.cellJ) }; renderViewerTab();
  }));
  document.getElementById("btnSendPairToBattle")?.addEventListener("click", () => {
    const rb = top20[selCell.i], cb = top20[selCell.j];
    if (!rb || !cb) return;
    APP.battle.A = reconcileBuild(parseSpec(rb.spec));
    APP.battle.B = reconcileBuild(parseSpec(cb.spec));
    syncPoolRunDefault(); switchTab("battle");
    toast("選択した 2 型をテストへ送りました", "info");
  });

  wireViewerSendButtons(root);
  document.getElementById("inListSearch")?.addEventListener("input", (e) => {
    st.listFilter.q = e.target.value; refreshViewerExpected(root);
  });
  document.getElementById("selListGrp")?.addEventListener("change", (e) => { st.listFilter.group = e.target.value; renderViewerTab(); });
  document.getElementById("selListMv")?.addEventListener("change", (e) => { st.listFilter.move = e.target.value; renderViewerTab(); });
  document.getElementById("selListIt")?.addEventListener("change", (e) => { st.listFilter.item = e.target.value; renderViewerTab(); });
  root.querySelectorAll("[data-vsort]").forEach((btn) => btn.addEventListener("click", () => {
    const k = btn.dataset.vsort;
    if (st.sort.key === k) st.sort.dir = st.sort.dir === "desc" ? "asc" : "desc";
    else st.sort = { key: k, dir: "desc" };
    renderViewerTab();
  }));
}

document.querySelectorAll(".nav-tabs button").forEach((btn) => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

renderBattleTab();
refreshServerState();
</script>
</body>
</html>
