<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Champions 1on1 Studio — Stage 8 全種族ワークベンチ</title>
<style>
:root{
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eef2f7;
  --hover: #edf2f8;
  --text: #0f172a;
  --text-2: #334155;
  --dim: #64748b;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;

  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.10);
  --accent-ring: rgba(37, 99, 235, 0.24);

  --good: #059669;
  --good-soft: rgba(5, 150, 105, 0.11);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.12);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.10);
  --opp: #ea580c;
  --opp-soft: rgba(234, 88, 12, 0.12);

  --nav-bg: rgba(255, 255, 255, 0.84);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 8px 24px -6px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-pop: 0 18px 42px -10px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(15, 23, 42, 0.06);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --tc-0:#64748b; --tc-1:#ea580c; --tc-2:#2563eb; --tc-3:#ca8a04;
  --tc-4:#16a34a; --tc-5:#0891b2; --tc-6:#dc2626; --tc-7:#9333ea;
  --tc-8:#b45309; --tc-9:#4f46e5; --tc-10:#db2777; --tc-11:#65a30d;
  --tc-12:#a16207; --tc-13:#6d28d9; --tc-14:#4338ca; --tc-15:#475569;
  --tc-16:#526075; --tc-17:#e11d74;
}

@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg: #0b111c;
    --surface: #121b2b;
    --surface-2: #172235;
    --surface-3: #1e2b42;
    --hover: #21304a;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --dim: #8b9bb4;
    --border: #243247;
    --border-strong: #334561;

    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-ink: #ffffff;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --accent-ring: rgba(96, 165, 250, 0.30);

    --good: #34d399;
    --good-soft: rgba(52, 211, 153, 0.15);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.15);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.15);
    --opp: #fb923c;
    --opp-soft: rgba(251, 146, 60, 0.16);

    --nav-bg: rgba(11, 17, 28, 0.82);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    --shadow-md: 0 12px 28px -8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    --shadow-pop: 0 24px 48px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.09);

    --tc-0:#94a3b8; --tc-1:#fb923c; --tc-2:#60a5fa; --tc-3:#facc15;
    --tc-4:#4ade80; --tc-5:#22d3ee; --tc-6:#f87171; --tc-7:#c084fc;
    --tc-8:#f59e0b; --tc-9:#818cf8; --tc-10:#f472b6; --tc-11:#a3e635;
    --tc-12:#d97706; --tc-13:#a78bfa; --tc-14:#818cf8; --tc-15:#94a3b8;
    --tc-16:#94a3b8; --tc-17:#f472b6;
  }
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --bg: #0b111c;
  --surface: #121b2b;
  --surface-2: #172235;
  --surface-3: #1e2b42;
  --hover: #21304a;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --dim: #8b9bb4;
  --border: #243247;
  --border-strong: #334561;

  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-ink: #ffffff;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --accent-ring: rgba(96, 165, 250, 0.30);

  --good: #34d399;
  --good-soft: rgba(52, 211, 153, 0.15);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.15);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.15);
  --opp: #fb923c;
  --opp-soft: rgba(251, 146, 60, 0.16);

  --nav-bg: rgba(11, 17, 28, 0.82);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  --shadow-md: 0 12px 28px -8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --shadow-pop: 0 24px 48px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.09);

  --tc-0:#94a3b8; --tc-1:#fb923c; --tc-2:#60a5fa; --tc-3:#facc15;
  --tc-4:#4ade80; --tc-5:#22d3ee; --tc-6:#f87171; --tc-7:#c084fc;
  --tc-8:#f59e0b; --tc-9:#818cf8; --tc-10:#f472b6; --tc-11:#a3e635;
  --tc-12:#d97706; --tc-13:#a78bfa; --tc-14:#818cf8; --tc-15:#94a3b8;
  --tc-16:#94a3b8; --tc-17:#f472b6;
}
:root[data-theme="light"]{ color-scheme: light; }

*{ box-sizing: border-box; }
html{ font-size: 14.5px; -webkit-font-smoothing: antialiased; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  line-height: 1.5;
  overflow-x: clip;
}
button, select, input, textarea{ font: inherit; color: inherit; }
.mono{ font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
.tnum{ font-variant-numeric: tabular-nums; }
.dim{ color: var(--dim); }
.small{ font-size: 0.82rem; }
.xs{ font-size: 0.74rem; }

/* Focus visible */
:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Sticky Frosted Topbar */
.topbar{
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--nav-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner{
  max-width: 1400px;
  margin: 0 auto;
  padding: 0.6rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem 1.25rem;
}
.brand{
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.brand-mark{
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
  flex-shrink: 0;
}
.brand-title{
  font-weight: 800;
  font-size: 1.02rem;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.brand-sub{
  font-size: 0.75rem;
  color: var(--dim);
}

/* Segmented Primary Nav Tabs */
.nav-tabs{
  display: inline-flex;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 3px;
  gap: 2px;
}
.nav-tabs button{
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  border: 0;
  background: transparent;
  color: var(--dim);
  font-weight: 600;
  font-size: 0.86rem;
  padding: 0.42rem 0.95rem;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.nav-tabs button[aria-selected="true"]{
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
@media (hover: hover) and (pointer: fine){
  .nav-tabs button:hover:not([aria-selected="true"]){ color: var(--text); }
}
.nav-tabs button:active{ transform: scale(0.97); }
.pulse-dot{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px var(--good-soft);
}

.topbar-right{
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
.conn-pill{
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.28rem 0.7rem;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.76rem;
  font-weight: 600;
}
.conn-pill .dot{ width: 7px; height: 7px; border-radius: 50%; }
.conn-pill.ok{ border-color: color-mix(in srgb, var(--good) 40%, var(--border)); color: var(--good); background: var(--good-soft); }
.conn-pill.ok .dot{ background: var(--good); }
.conn-pill.warn{ border-color: color-mix(in srgb, var(--warn) 38%, var(--border)); color: var(--warn); background: var(--warn-soft); }
.conn-pill.warn .dot{ background: var(--warn); }

.theme-seg{
  display: inline-flex;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 2px;
}
.theme-seg button{
  border: 0;
  background: transparent;
  color: var(--dim);
  font-size: 0.74rem;
  font-weight: 600;
  padding: 0.22rem 0.55rem;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: transform 120ms var(--ease-out), background-color 140ms ease, color 140ms ease;
}
.theme-seg button[aria-pressed="true"]{
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Main Workspace */
.shell{
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.15rem 1.25rem 4rem;
}
.tab-view{ display: flex; flex-direction: column; gap: 1rem; }
.tab-view[hidden]{ display: none; }

/* Cards & Bento Surfaces */
.card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.1rem 1.2rem;
  box-shadow: var(--shadow-sm);
}
.card-sub{
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.85rem 1rem;
}
.card-head{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
  margin-bottom: 0.85rem;
}
.card-title{
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}
.row{ display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.grid-2{ display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 1020px){ .grid-2{ grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.grid-3{ display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
@media (min-width: 780px){ .grid-3{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.grid-4{ display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }

/* Buttons & Controls */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 2.2rem;
  padding: 0.35rem 0.85rem;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 0.84rem;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 130ms var(--ease-out), background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
}
@media (hover: hover) and (pointer: fine){
  .btn:hover:not(:disabled){ background: var(--hover); border-color: var(--border-strong); }
}
.btn:active:not(:disabled){ transform: scale(0.97); }
.btn:disabled{ opacity: 0.45; cursor: not-allowed; }
.btn.primary{
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 2px 8px var(--accent-ring);
}
@media (hover: hover) and (pointer: fine){
  .btn.primary:hover:not(:disabled){ background: var(--accent-hover); border-color: var(--accent-hover); }
}
.btn.ghost{
  background: var(--surface-2);
  border-color: var(--border);
}
.btn.danger{
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
  background: var(--danger-soft);
}
.btn.sm{ min-height: 1.8rem; padding: 0.18rem 0.6rem; font-size: 0.78rem; border-radius: 7px; }
.btn.xs{ min-height: 1.55rem; padding: 0.1rem 0.48rem; font-size: 0.73rem; border-radius: 6px; }
.btn.icon{ width: 2rem; min-height: 2rem; padding: 0; }

input[type="text"], input[type="number"], input[type="search"], select, textarea{
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  padding: 0.38rem 0.65rem;
  min-height: 2.2rem;
  font-size: 0.85rem;
  transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
}
input:focus, select:focus, textarea:focus{
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-ring);
}
select option{
  background: var(--surface);
  color: var(--text);
}
.help-dot{
  display: inline-grid;
  place-items: center;
  width: 1.15rem;
  height: 1.15rem;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--dim);
  font-size: 0.7rem;
  font-weight: 800;
  cursor: pointer;
  padding: 0;
  vertical-align: middle;
  transition: transform 110ms var(--ease-out), border-color 130ms ease, color 130ms ease, background-color 130ms ease;
}
@media (hover: hover) and (pointer: fine){
  .help-dot:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
}
.help-dot:active{ transform: scale(0.92); }
.field{ display: flex; flex-direction: column; gap: 0.28rem; min-width: 0; }
.field-lbl{ font-size: 0.74rem; font-weight: 700; color: var(--dim); letter-spacing: 0.02em; }

/* Segmented Button Strips */
.seg{
  display: inline-flex;
  flex-wrap: wrap;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg button{
  border: 0;
  background: transparent;
  color: var(--dim);
  font-size: 0.79rem;
  font-weight: 600;
  padding: 0.28rem 0.68rem;
  border-radius: 7px;
  cursor: pointer;
  transition: transform 110ms var(--ease-out), background-color 130ms ease, color 130ms ease;
}
.seg button[aria-pressed="true"]{
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.seg button:disabled{ opacity: 0.38; cursor: not-allowed; }
.seg button:active:not(:disabled){ transform: scale(0.97); }

/* Badges & Type Pills */
.badge{
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.14rem 0.52rem;
  border-radius: var(--r-pill);
  font-size: 0.74rem;
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  white-space: nowrap;
}
.badge.acc{ border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); color: var(--accent); }
.badge.good{ border-color: color-mix(in srgb, var(--good) 35%, transparent); background: var(--good-soft); color: var(--good); }
.badge.warn{ border-color: color-mix(in srgb, var(--warn) 38%, transparent); background: var(--warn-soft); color: var(--warn); }
.badge.bad{ border-color: color-mix(in srgb, var(--danger) 38%, transparent); background: var(--danger-soft); color: var(--danger); }
.badge.opp{ border-color: color-mix(in srgb, var(--opp) 38%, transparent); background: var(--opp-soft); color: var(--opp); }

.type-pill{
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
  padding: 0.12rem 0.5rem;
  border-radius: var(--r-pill);
  font-size: 0.72rem;
  font-weight: 700;
  background: color-mix(in srgb, var(--tc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tc) 34%, transparent);
  color: var(--text);
  white-space: nowrap;
}
.type-pill::before{
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tc);
  flex-shrink: 0;
}

/* Alerts */
.callout{
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  padding: 0.62rem 0.85rem;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 0.83rem;
}
.callout.good{ border-color: color-mix(in srgb, var(--good) 35%, var(--border)); background: var(--good-soft); color: var(--good); }
.callout.warn{ border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); background: var(--warn-soft); color: var(--warn); }
.callout.bad{ border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: var(--danger-soft); color: var(--danger); }
.callout.acc{ border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: var(--accent-soft); color: var(--accent); }

/* Tab 1: Battle Matchup Command Bar */
.vs-dock{
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 0.9rem 1.15rem;
  box-shadow: var(--shadow-sm);
}
@media (min-width: 1020px){
  .vs-dock{ grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); }
}
.vs-side-summary{
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.55rem 0.75rem;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.vs-side-summary.side-a{ border-left: 3px solid var(--accent); }
.vs-side-summary.side-b{ border-right: 3px solid var(--opp); text-align: left; }
.vs-center-actions{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
}

/* Clickable Search Picker Trigger */
.picker-trigger{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  width: 100%;
  min-height: 2.65rem;
  padding: 0.45rem 0.75rem;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  cursor: pointer;
  text-align: left;
  transition: transform 120ms var(--ease-out), border-color 140ms ease, background-color 140ms ease;
}
@media (hover: hover) and (pointer: fine){
  .picker-trigger:hover{ background: var(--hover); border-color: var(--accent); }
}
.picker-trigger:active{ transform: scale(0.99); }
.picker-trigger.compact{ min-height: 2.2rem; padding: 0.3rem 0.65rem; border-radius: var(--r-sm); }

/* Stat Matrix & Visual Bars */
.stat-list{ display: flex; flex-direction: column; gap: 0.42rem; margin-top: 0.5rem; }
.stat-row{
  display: grid;
  grid-template-columns: 2.6rem 2.2rem minmax(70px,1fr) auto 4.8rem 64px;
  gap: 0.45rem;
  align-items: center;
  padding: 0.26rem 0.45rem;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
@media (max-width: 620px){
  .stat-row{ grid-template-columns: 2.4rem 1.8rem 1fr auto 4.2rem; }
  .stat-bar-track{ display: none; }
}
.stat-name{ font-weight: 800; font-size: 0.82rem; display: flex; align-items: center; gap: 0.2rem; }
.stat-base{ font-size: 0.76rem; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.stat-slider{
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
  margin: 0;
}
.stepper{
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: var(--surface);
  overflow: hidden;
}
.stepper button{
  border: 0;
  background: transparent;
  width: 1.55rem;
  height: 1.7rem;
  font-weight: 700;
  cursor: pointer;
  color: var(--dim);
  transition: background-color 120ms ease, color 120ms ease;
}
@media (hover: hover) and (pointer: fine){
  .stepper button:hover{ background: var(--hover); color: var(--text); }
}
.stepper input{
  border: 0;
  background: transparent;
  width: 2.55rem;
  min-height: 1.7rem;
  padding: 0.05rem 0.15rem;
  text-align: center;
  font-weight: 700;
  font-size: 0.82rem;
  box-shadow: none !important;

.stepper input::-webkit-outer-spin-button{ -webkit-appearance: none; margin: 0; }
.stat-real{

  font-weight: 800;
  font-size: 0.88rem;

}
.stat-bar-track{
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.stat-bar-fill{

  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), #6366f1);

/* 2x2 Move Slot Cards */
.move-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
@media (min-width: 540px){ .move-grid{ grid-template-columns: 1fr 1fr; } }
.move-slot{
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.58rem 0.72rem 0.58rem 0.85rem;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  text-align: left;
  min-height: 4.1rem;
  transition: transform 120ms var(--ease-out), border-color 140ms ease, background-color 140ms ease;
}
.move-slot::before{
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--tc, var(--border));
}
.move-slot.empty{
  border-style: dashed;
  justify-content: center;
  align-items: center;
  color: var(--dim);
  font-weight: 600;
}
.move-slot.empty::before{ display: none; }
@media (hover: hover) and (pointer: fine){
  .move-slot:hover{ background: var(--hover); border-color: var(--accent); }
}
.move-slot:active{ transform: scale(0.985); }
.move-clear{
  border: 0;
  background: transparent;
  color: var(--dim);
  font-size: 0.9rem;
  line-height: 1;
  width: 1.45rem;
  height: 1.45rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine){
  .move-clear:hover{ background: var(--danger-soft); color: var(--danger); }
}

/* Battle Scoreboard & Timeline */
.duel-bar{
  display: flex;
  height: 1.65rem;
  border-radius: var(--r-pill);
  overflow: hidden;
  border: 1px solid var(--border);
  font-size: 0.78rem;
  font-weight: 800;
  margin-top: 0.6rem;
}
.duel-bar .seg-a{ background: var(--accent); color: #fff; display: flex; align-items: center; padding: 0 0.65rem; white-space: nowrap; }
.duel-bar .seg-d{ background: var(--surface-3); color: var(--dim); display: flex; align-items: center; justify-content: center; white-space: nowrap; }
.duel-bar .seg-b{ background: var(--opp); color: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 0 0.65rem; white-space: nowrap; }

.kpi-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.7rem;
  margin-top: 0.85rem;
}
.kpi-card{
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.72rem 0.9rem;
}
.kpi-card .kl{ font-size: 0.74rem; font-weight: 700; color: var(--dim); }
.kpi-card .kv{ font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.12rem; }
.kpi-card .ks{ font-size: 0.76rem; color: var(--dim); margin-top: 0.14rem; }

.timeline{
  display: flex;
  flex-direction: column;
  gap: 0.42rem;
  max-height: 310px;
  overflow-y: auto;
  padding-right: 0.25rem;
}
.tl-item{
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  padding: 0.45rem 0.65rem;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 0.82rem;
}
.tl-item.win{ background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); font-weight: 700; }
.tl-tag{
  flex-shrink: 0;
  min-width: 2.3rem;
  text-align: center;
  padding: 0.08rem 0.35rem;
  border-radius: 6px;
  background: var(--surface-3);
  color: var(--text-2);
  font-weight: 800;
  font-size: 0.73rem;
}

/* Tab 2: Tier Bento & Toggle Chips */
.tier-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 0.65rem;
}
.tier-card{
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.78rem 0.9rem;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  text-align: left;
  cursor: pointer;
  transition: transform 130ms var(--ease-out), border-color 140ms ease, background-color 140ms ease, box-shadow 140ms ease;
}
.tier-card[aria-pressed="true"]{
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 2px var(--accent-ring);
}
@media (hover: hover) and (pointer: fine){
  .tier-card:hover:not([aria-pressed="true"]){ background: var(--hover); }
}
.tier-card:active{ transform: scale(0.985); }

.chip-grid{
  display: flex;
  flex-wrap: wrap;
  gap: 0.38rem;
  max-height: 230px;
  overflow-y: auto;
  padding: 0.45rem;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
}
.chip{
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.28rem 0.62rem;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 0.79rem;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: transform 110ms var(--ease-out), background-color 130ms ease, border-color 130ms ease, color 130ms ease;
}
.chip.on{
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 1px 4px var(--accent-ring);
}
.chip.on .xs.dim{ color: rgba(255,255,255,0.82); }
.chip.req{
  background: #b45309;
  border-color: #b45309;
  color: #ffffff;
  box-shadow: 0 1px 4px rgba(180, 83, 9, 0.28);
}
.chip.req .xs.dim{ color: rgba(255,255,255,0.85); }
.chip:active{ transform: scale(0.96); }
.chip-check{
  font-size: 0.74rem;
  font-weight: 900;
}
.chip-star{
  border: 0;
  background: rgba(15, 23, 42, 0.08);
  padding: 0.05rem 0.3rem;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--dim);
  border-radius: 99px;
}
.chip.on .chip-star, .chip.req .chip-star{
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
}
.chip-star.pinned{ color: #fef08a; background: rgba(0, 0, 0, 0.25); }
.sel-tray{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 0.65rem;
  border-radius: var(--r-md);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
}

.stage-pipe{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
}
.stage-node{
  display: inline-flex;
  align-items: center;
  gap: 0.28rem;
  padding: 0.2rem 0.6rem;
  border-radius: var(--r-pill);
  font-size: 0.74rem;
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--dim);
}
.stage-node.done{ background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, transparent); color: var(--good); }
.stage-node.active{
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 0 3px var(--accent-ring);
}
.prog-track{
  width: 100%;
  height: 8px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.prog-fill{
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), #6366f1);
  transition: width 220ms var(--ease-out);
}

/* Tab 3: Analysis Dashboard & Heatmap */
.mix-bar{
  display: flex;
  height: 10px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface-3);
  margin: 0.55rem 0 0.75rem;
}
.mix-beginner{ background: #06b6d4; }
.mix-meta{ background: #6366f1; }
.mix-original{ background: #f59e0b; }
.mix-advanced{ background: #10b981; }

.build-cards{
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.8rem;
}
@media (min-width: 920px){ .build-cards{ grid-template-columns: 1fr 1fr; } }
.bcard{
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.48rem;
}
.bcard.rank1{
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.winbar{ display: flex; align-items: center; gap: 0.55rem; font-size: 0.79rem; }
.winbar .wl{ width: 7.4rem; flex-shrink: 0; color: var(--dim); font-weight: 600; }
.winbar .wt{ flex: 1; height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.winbar .wf{ display: block; height: 100%; border-radius: 99px; }
.winbar .wv{ width: 3.4rem; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

.matrix-wrap{ overflow-x: auto; padding-top: 0.35rem; }
.matrix-grid{ display: grid; gap: 2px; min-width: 480px; }
.matrix-grid .mh, .matrix-grid .mr{
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--dim);
}
.matrix-grid button.cell{
  aspect-ratio: 1;
  border: 0;
  border-radius: 5px;
  padding: 0;
  font-size: 0.68rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 90ms var(--ease-out);
}
.matrix-grid button.cell.active{
  outline: 2px solid var(--text);
  outline-offset: 1px;
  transform: scale(1.06);
  z-index: 2;
}
.cell-1{ background: #2563eb; color: #fff; }
.cell-2{ background: color-mix(in srgb, #2563eb 58%, var(--surface-3)); color: var(--text); }
.cell-3{ background: color-mix(in srgb, #2563eb 28%, var(--surface-3)); color: var(--text); }
.cell-4{ background: var(--surface-3); color: var(--dim); }
.cell-5{ background: color-mix(in srgb, #ef4444 35%, var(--surface-3)); color: var(--text); }
.cell-6{ background: color-mix(in srgb, #ef4444 65%, var(--surface-3)); color: #fff; }

/* Tables */
.tbl-scroll{
  max-height: 500px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
table.tbl{ width: 100%; border-collapse: collapse; font-size: 0.83rem; }
table.tbl th, table.tbl td{
  padding: 0.55rem 0.65rem;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
table.tbl thead th{
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  font-size: 0.76rem;
  color: var(--dim);
  font-weight: 700;
}
@media (hover: hover) and (pointer: fine){
  table.tbl tbody tr:hover{ background: var(--hover); }
}

.rate-acc{ color: var(--good); font-weight: 800; }
.rate-warn{ color: var(--warn); font-weight: 800; }
.rate-danger{ color: var(--danger); font-weight: 800; }

/* Terminal Console */
.console{
  background: #090e17;
  color: #dbe7f5;
  border: 1px solid #1e293b;
  border-radius: var(--r-md);
  padding: 0.75rem 0.9rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.77rem;
  max-height: 220px;
  overflow: auto;
  white-space: pre-wrap;
  margin: 0;
}

/* Dropzone */
.dropzone{
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.42rem 0.85rem;
  border-radius: var(--r-md);
  border: 1.5px dashed var(--border-strong);
  background: var(--surface-2);
  cursor: pointer;
  font-size: 0.81rem;
  font-weight: 600;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.dropzone.drag, .dropzone:hover{
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* Origin-Aware Floating Popover */
.popover-backdrop{
  position: fixed;
  inset: 0;
  z-index: 80;
  display: none;
}
.popover-backdrop.open{ display: block; }
.popover{
  position: fixed;
  z-index: 81;
  width: min(440px, calc(100vw - 24px));
  max-height: 430px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
  transform-origin: var(--origin, top left);
  opacity: 0;
  transform: scale(0.95);
  pointer-events: none;
  transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
}
.popover[hidden]{ display: none !important; }
.popover.open{
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}
.popover-head{
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.popover-list{
  overflow-y: auto;
  padding: 0.35rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pop-item{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
  width: 100%;
  padding: 0.46rem 0.65rem;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color 100ms ease;
}
.pop-item.selected{ background: var(--accent-soft); }
@media (hover: hover) and (pointer: fine){
  .pop-item:hover{ background: var(--hover); }
}

/* Modal */
.modal-backdrop{
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(2, 6, 23, 0.55);
  backdrop-filter: blur(4px);
  display: none;
  place-items: center;
  padding: 1rem;
}
.modal-backdrop:not(.open){ pointer-events: none; }
.modal-backdrop.open{ display: grid; }
.modal-card{
  width: min(560px, 100%);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  padding: 1.15rem 1.25rem;
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
}
.modal-card.wide{
  width: min(780px, 100%);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
}
.help-scroll{
  overflow-y: auto;
  margin-top: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding-right: 0.2rem;
}
.help-item{
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.75rem 0.95rem;
}
.help-item h4{ margin: 0 0 0.3rem; font-size: 0.92rem; display: flex; align-items: center; gap: 0.45rem; }
.help-item p{ margin: 0.22rem 0 0; font-size: 0.83rem; color: var(--text-2); line-height: 1.55; }
.modal-backdrop.open .modal-card{ opacity: 1; transform: scale(1); }

/* Toasts */
.toast-host{
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
  max-width: min(360px, calc(100vw - 2rem));
}
.toast{
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.62rem 0.9rem;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-md);
  font-size: 0.83rem;
  font-weight: 600;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
}
@starting-style{
  .toast{ opacity: 0; transform: translateY(10px); }
}
.toast.good{ border-left: 4px solid var(--good); }
.toast.bad{ border-left: 4px solid var(--danger); }
.toast.info{ border-left: 4px solid var(--accent); }
.toast.leaving{ opacity: 0; transform: translateY(8px); }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>

  { up: 3, down: 5, key: "3,5", name: "れいせい", short: "れいせい", corr: "C↑ S↓" },
  { up: 4, down: 1, key: "4,1", name: "おだやか", short: "おだやか", corr: "D↑ A↓" },
  { up: 4, down: 2, key: "4,2", name: "おとなしい", short: "おとなしい", corr: "D↑ B↓" },

];
const NATURE_BY_KEY = Object.fromEntries(NATURES.map((n) => [n.key, n]));

const ALL_SPECIES_LIST = Object.values(META.species).sort((a, b) => a.ja.localeCompare(b.ja, "ja"));
const MOVE_CODE_TO_ID = {};
for (const [id, mv] of Object.entries(META.moves)) {
  MOVE_CODE_TO_ID[id] = id;
  if (mv.code) MOVE_CODE_TO_ID[mv.code] = id;
}
const NON_STONE_ITEMS = Object.entries(META.items)
  .filter(([id, it]) => it.legal && !it.stone)
  .sort((a, b) => (a[0] === "none" ? -1 : b[0] === "none" ? 1 : a[1].ja.localeCompare(b[1].ja, "ja")));

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pct(r) { return (r * 100).toFixed(1) + "%"; }
function rateCls(r) { return r >= 0.5 ? "rate-acc" : r >= 0.4 ? "rate-warn" : "rate-danger"; }
function spName(id) { return META.species[id]?.ja || id; }
function mvName(id) { const c = MOVE_CODE_TO_ID[id] || id; return META.moves[c]?.ja || c; }
function itName(id) { return META.items[id]?.ja || id; }
function abName(id) { return META.abilities[id]?.ja || id; }
function typeBadge(idx) {
  if (idx < 0 || !META.types[idx]) return "";
  return `<span class="type-pill" style="--tc:var(--tc-${idx})">${esc(META.types[idx].ja)}</span>`;
}

function calcLv50Stats(base, points, up, down) {
  return base.map((b, i) => {
    const core = Math.floor((2 * b + 31) / 2) + (i === 0 ? 60 : 5);
    let v = core + (points[i] || 0);
    if (i > 0 && i === up) v = Math.floor((v * 110) / 100);
    if (i > 0 && i === down) v = Math.floor((v * 90) / 100);
    return v;
  });
}

function speciesNormalProfile(spId, sex) {
  const sp = META.species[spId];
  if (!sp) return null;
  if (spId === "meowstic" && sex === "f" && sp.femaleNormal) {
    return { base: sp.femaleNormal.base, types: sp.femaleNormal.types, ja: `${sp.ja} (♀)` };
  }
  return { base: sp.base, types: sp.types, ja: sp.ja };
}

function speciesMegaTarget(spId, sex, stoneId) {
  const sp = META.species[spId];
  if (!sp || !sp.megas) return null;
  return sp.megas.find((m) => m.stone === stoneId && m.sexes.includes(sex)) || null;
}

function isWastedPoint(points, down, baseForms) {
  if (!down || !points[down]) return false;
  return baseForms.every((base) => {
    const raw = base[down] + 20 + points[down];
    return Math.floor((raw * 9) / 10) === Math.floor(((raw - 1) * 9) / 10);
  });
}

function legalMegasForSpecies(sp) {
  return [0, 1, 2].filter((m) => m === 0 || sp.megas.some((mg) => mg.modes.includes(m)));
}

function defaultBuild(spId = "gyarados") {
  const sp = META.species[spId] || ALL_SPECIES_LIST[0];
  const sex = sp.sexes[0] || "m";
  const moves = (sp.moves[sex] || []).slice(0, 4);
  const mega0 = sp.megas.find((m) => m.sexes.includes(sex));
  const useMega = Boolean(mega0 && mega0.modes.includes(1));
  const megaMode = useMega ? (mega0.modes.includes(2) ? 2 : 1) : 0;
  const item = useMega ? mega0.stone : "none";
  const ability = megaMode === 1 ? mega0.ability : (sp.abilities[sex]?.[0] || "none");
  return {
    species: sp.id,
    points: [32, 32, 2, 0, 0, 0],
    moves,
    policy: "obsh4",
    item,
    mega: megaMode,
    ability,
    nature: "0,0",
    sex,
  };
}

function formatSpec(b) {
  return `${b.species}:${b.points.join(",")}|${b.moves.join(",")}|${b.policy}|${b.item}|${b.mega}|${b.ability}|${b.nature}|${b.sex}`;
}

function parseSpec(specStr) {
  const s = String(specStr || "").trim();
  const f = s.split("|");
  if (f.length !== 8 || !f[0].includes(":")) {
    throw new Error("Stage 8 (v3) 形式（8フィールド・種族:配分）を指定してください。旧形式データは対象外です。");
  }
  const [sp, ptsStr] = f[0].split(":", 2);
  if (!META.species[sp]) throw new Error(`未知の種族 ID: ${sp}`);
  const points = ptsStr.split(",").map(Number);
  if (points.length !== 6 || points.some((x) => !Number.isInteger(x) || x < 0 || x > 32)) {
    throw new Error("ポイント配分は 0〜32 の整数 6 個が必要です");
  }
  const moves = f[1].split(",").map((m) => MOVE_CODE_TO_ID[m.trim()] || m.trim()).filter(Boolean);
  if (!moves.length) throw new Error("技が 1 つ以上必要です");
  const badMove = moves.find((m) => !META.moves[m]);
  if (badMove) throw new Error(`未知の技 ID: ${badMove}`);
  const nat = f[6];
  if (!NATURE_BY_KEY[nat]) throw new Error(`性格指定が不正です: ${nat}`);
  const mega = Number(f[4]);
  if (![0, 1, 2].includes(mega)) throw new Error(`メガ区分が不正です: ${f[4]}`);
  return {
    species: sp, points, moves, policy: f[2], item: f[3], mega, ability: f[5], nature: nat, sex: f[7],
  };
}

function summarizeBuildObj(b) {
  const sp = META.species[b.species];
  const nat = NATURE_BY_KEY[b.nature] || NATURES[0];
  const norm = speciesNormalProfile(b.species, b.sex);
  const megaTarget = b.mega ? speciesMegaTarget(b.species, b.sex, b.item) : null;
  const startBase = b.mega === 1 && megaTarget ? megaTarget.base : norm.base;
  const startStats = calcLv50Stats(startBase, b.points, nat.up, nat.down);
  const megaStats = b.mega === 2 && megaTarget ? calcLv50Stats(megaTarget.base, b.points, nat.up, nat.down) : null;
  const formLabel = b.mega === 1 && megaTarget ? megaTarget.ja : b.mega === 2 && megaTarget ? `${norm.ja} → ${megaTarget.ja}` : norm.ja;
  return { ...b, sp, nat, norm, megaTarget, startStats, megaStats, formLabel, movesSortedKey: [...b.moves].sort().join(",") };
}

function decodeBuildSummary(specStr) {
  return summarizeBuildObj(parseSpec(specStr));
}

function reconcileBuild(b, fillMovesIfEmpty = false) {
  const sp = META.species[b.species] || ALL_SPECIES_LIST[0];
  b.species = sp.id;
  if (!sp.sexes.includes(b.sex)) b.sex = sp.sexes[0] || "m";
  const legalMoves = sp.moves[b.sex] || [];
  b.moves = b.moves.filter((m) => legalMoves.includes(m));
  if (fillMovesIfEmpty && b.moves.length === 0) {
    for (const m of legalMoves) {
      if (b.moves.length >= 4) break;
      if (!b.moves.includes(m)) b.moves.push(m);
    }
  }
  const legalMegas = sp.megas.filter((m) => m.sexes.includes(b.sex));
  if (b.mega !== 0 && legalMegas.length === 0) b.mega = 0;
  if (b.mega !== 0) {
    let tgt = legalMegas.find((m) => m.stone === b.item) || legalMegas[0];
    if (!tgt.modes.includes(b.mega)) b.mega = tgt.modes[0];
    b.item = tgt.stone;
    if (b.mega === 1) b.ability = tgt.ability;
    else {
      const nAbs = sp.abilities[b.sex] || [];
      if (!nAbs.includes(b.ability)) b.ability = nAbs[0] || "none";
    }
  } else {
    if (!META.items[b.item] || META.items[b.item].stone) b.item = "none";
    const nAbs = sp.abilities[b.sex] || [];
    if (!nAbs.includes(b.ability)) b.ability = nAbs[0] || "none";
  }
  if (!NATURE_BY_KEY[b.nature]) b.nature = "0,0";
  return b;
}

/* ---------- Toast Notification Helper ---------- */
function toast(msg, kind = "info") {
  const host = document.getElementById("toastHost");
  if (!host) return;
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = msg;
  host.appendChild(el);
  let timer = setTimeout(dismiss, 2400);
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", () => { timer = setTimeout(dismiss, 1200); });
  function dismiss() {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 220);
  }
}

/* ---------- API & Server State ---------- */
async function apiGet(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function apiPost(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function syncPoolRunDefault() {
  const sp = APP.battle.A.species;
  const matching = APP.runs.filter((r) => r.hasResults && r.species === sp);
  if (!matching.some((r) => r.run === APP.battle.poolRun)) {
    APP.battle.poolRun = matching[0]?.run || "";
  }
}

function updateNavBadges() {
  const running = APP.jobs.some((j) => j.status === "generating" || j.status === "running");
  const navS = document.getElementById("navTabSearch");
  if (navS) {
    navS.innerHTML = running
      ? `2. 種族探索 <span class="pulse-dot" title="探索ジョブ実行中"></span>`
      : `2. 種族探索`;
  }
}

function updateStatusPill() {
  const el = document.getElementById("connStatus");
  if (!el) return;
  if (APP.serverOk) {
    const ok = APP.health?.matrix?.ok;
    el.className = "conn-pill ok";
    el.innerHTML = `<span class="dot"></span>接続中 · CPU ${APP.health?.cpuCount || "?"} · MD5 ${ok ? "OK" : "NG"}`;
  } else {
    el.className = "conn-pill warn";
    el.innerHTML = `<span class="dot"></span>静的モード（<span class="mono">server.py</span> 未起動）`;
  }
}

async function refreshServerState() {
  if (location.protocol === "file:") {
    APP.serverOk = false;
    updateStatusPill();
    return;
  }
  try {
    const [h, r, j] = await Promise.all([apiGet("/api/health"), apiGet("/api/runs"), apiGet("/api/search/jobs")]);
    APP.serverOk = true;
    APP.health = h;
    APP.runs = r.runs || [];
    APP.jobs = j.jobs || [];
    for (const job of APP.jobs) APP.search.lastJobStatuses[job.run] = job.status;
    if (!APP.search.shardsTouched && h.cpuCount) APP.search.shards = Math.max(1, Math.min(8, h.cpuCount));
    const completed = APP.runs.filter((x) => x.hasResults);
    if (!APP.viewer.selectedRun && completed.length) {
      APP.viewer.selectedRun = completed[0].run;
      loadRunIntoViewer(completed[0].run);
    }
    syncPoolRunDefault();
    syncJobPollingTimer();
    updateNavBadges();
  } catch (_) {
    APP.serverOk = false;
  }
  updateStatusPill();
  renderCurrentTab();
}

function switchTab(name) {
  closePicker();
  APP.activeTab = name;
  document.querySelectorAll(".nav-tabs button").forEach((b) => {
    b.setAttribute("aria-selected", b.dataset.tab === name ? "true" : "false");
  });
  ["battle", "search", "viewer"].forEach((t) => {
    document.getElementById(`tab-${t}`).hidden = t !== name;
  });
  renderCurrentTab();
  if (name === "viewer" && APP.serverOk) pollJobsOnce();
}
function renderCurrentTab() {
  if (APP.activeTab === "battle") renderBattleTab();
  else if (APP.activeTab === "search") renderSearchTab();
  else renderViewerTab();
}

/* ---------- Origin-Aware Search Picker Popover (Species / Item / Move) ---------- */
const POP = { open: false, kind: "", side: "A", slot: 0, query: "", cat: "all", onPick: null };

function closePicker() {
  POP.open = false;
  const pop = document.getElementById("pickerPopover");
  const bd = document.getElementById("popBackdrop");
  if (!pop || !bd) return;
  pop.classList.remove("open");
  bd.classList.remove("open");
  setTimeout(() => { if (!POP.open) pop.hidden = true; }, 160);
}

function positionPopover(triggerEl) {
  const pop = document.getElementById("pickerPopover");
  const rect = triggerEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const width = Math.min(440, vw - 24);
  let left = Math.max(12, Math.min(rect.left, vw - width - 12));
  const spaceBelow = vh - rect.bottom - 14;
  const preferTop = spaceBelow < 280 && rect.top > spaceBelow;
  let top = preferTop ? Math.max(12, rect.top - Math.min(430, rect.top - 12) - 6) : rect.bottom + 6;
  const maxH = preferTop ? rect.top - top - 6 : Math.min(430, vh - top - 12);
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
  pop.style.width = `${width}px`;
  pop.style.maxHeight = `${Math.max(220, maxH)}px`;
  const originY = preferTop ? "bottom" : "top";
  const originX = rect.left + rect.width / 2 > vw / 2 ? "right" : "left";
  pop.style.setProperty("--origin", `${originY} ${originX}`);
}

function openPicker({ trigger, kind, side = "A", slot = 0, current = "", onPick }) {
  POP.open = true;
  POP.kind = kind;
  POP.side = side;
  POP.slot = slot;
  POP.query = "";
  POP.cat = "all";
  POP.current = current;
  POP.onPick = onPick;

  const pop = document.getElementById("pickerPopover");
  const bd = document.getElementById("popBackdrop");
  const head = document.getElementById("pickerHead");
  pop.hidden = false;
  positionPopover(trigger);

  const ph = kind === "species" ? "種族名（日本語 / 英語 / メガ）で検索…"
    : kind === "item" ? "もちもの名（日本語 / ID）で検索…"
    : "技名 / ID / コードで検索…";
  const catPills = kind === "move"
    ? `<div class="seg" id="popMoveCats">
        <button type="button" data-pcat="all" aria-pressed="true">すべて</button>
        <button type="button" data-pcat="0" aria-pressed="false">物理</button>
        <button type="button" data-pcat="1" aria-pressed="false">特殊</button>
        <button type="button" data-pcat="2" aria-pressed="false">変化</button>
      </div>` : "";
  head.innerHTML = `<input type="search" id="inPopSearch" placeholder="${ph}" autocomplete="off" />${catPills}`;
  bd.classList.add("open");
  requestAnimationFrame(() => pop.classList.add("open"));

  const inp = document.getElementById("inPopSearch");
  inp.addEventListener("input", () => { POP.query = inp.value; renderPickerItems(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closePicker(); trigger.focus(); }
    else if (e.key === "Enter") {
      const first = document.querySelector("#pickerList .pop-item");
      if (first) { e.preventDefault(); first.click(); }
    }
  });
  head.querySelectorAll("[data-pcat]").forEach((b) => {
    b.addEventListener("click", () => {
      POP.cat = b.dataset.pcat;
      head.querySelectorAll("[data-pcat]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.pcat === POP.cat ? "true" : "false"));
      renderPickerItems();
    });
  });

  renderPickerItems();
  setTimeout(() => inp?.focus(), 20);
}

function renderPickerItems() {
  const list = document.getElementById("pickerList");
  const q = POP.query.trim().toLowerCase();
  let rows = "";

  if (POP.kind === "species") {
    const matched = ALL_SPECIES_LIST.filter((s) =>
      !q || s.ja.toLowerCase().includes(q) || s.id.includes(q) || s.en.toLowerCase().includes(q) ||
      s.megas.some((m) => m.ja.toLowerCase().includes(q) || m.id.includes(q))
    );
    rows = matched.slice(0, 120).map((s) => {
      const bst = s.base.reduce((a, b) => a + b, 0);
      const sel = s.id === POP.current;
      return `<button type="button" class="pop-item ${sel ? "selected" : ""}" data-pick-val="${esc(s.id)}">
        <div>
          <div style="font-weight:700">${esc(s.ja)} <span class="xs dim mono">${esc(s.id)}</span></div>
          <div class="row" style="gap:0.25rem; margin-top:0.15rem">${s.types.map(typeBadge).join("")}${s.megas.length ? `<span class="badge xs acc">メガ対応</span>` : ""}</div>
        </div>
        <span class="xs dim mono tnum">BST ${bst}</span>
      </button>`;
    }).join("");
  } else if (POP.kind === "item") {
    const matched = NON_STONE_ITEMS.filter(([id, it]) => !q || it.ja.toLowerCase().includes(q) || id.includes(q));
    rows = matched.map(([id, it]) => `<button type="button" class="pop-item ${id === POP.current ? "selected" : ""}" data-pick-val="${esc(id)}">
      <span style="font-weight:600">${esc(it.ja)}</span>
      <span class="xs dim mono">${esc(id)}</span>
    </button>`).join("");
  } else if (POP.kind === "move") {
    const b = APP.battle[POP.side];
    const sp = META.species[b.species];
    const learnset = (sp.moves[b.sex] || []).slice().sort((x, y) => (META.moves[y]?.p || 0) - (META.moves[x]?.p || 0) || mvName(x).localeCompare(mvName(y), "ja"));
    const equipped = new Set(b.moves);
    const items = [];
    if (b.moves[POP.slot]) {
      items.push(`<button type="button" class="pop-item" data-pick-val=""><span style="color:var(--danger);font-weight:700">（この枠を空白にする）</span><span class="xs badge bad">解除</span></button>`);
    }
    for (const mid of learnset) {
      const m = META.moves[mid];
      if (!m) continue;
      if (POP.cat !== "all" && String(m.c) !== POP.cat) continue;
      if (q && !m.ja.toLowerCase().includes(q) && !mid.includes(q) && !(m.code || "").toLowerCase().includes(q)) continue;
      const isCur = b.moves[POP.slot] === mid;
      const inOther = !isCur && equipped.has(mid);
      items.push(`<button type="button" class="pop-item ${isCur ? "selected" : ""}" data-pick-val="${esc(mid)}">
        <div style="min-width:0">
          <div class="row" style="gap:0.35rem">
            ${typeBadge(m.t)}
            <span style="font-weight:700">${esc(m.ja)}</span>
            ${isCur ? `<span class="badge xs acc">現在</span>` : inOther ? `<span class="badge xs">採用済</span>` : ""}
          </div>
          <div class="xs dim mono" style="margin-top:0.12rem">${CAT_LABEL[m.c]} · ${m.p > 0 ? `威力 ${m.p}` : "変化技"} · 命中 ${m.acc > 100 ? "必中" : m.acc} · PP${m.pp}${m.prio ? ` · 優先${m.prio > 0 ? "+" + m.prio : m.prio}` : ""}</div>
        </div>
        <span class="xs dim mono">${esc(m.code)}</span>
      </button>`);
    }
    rows = items.join("");
  }

  list.innerHTML = rows || `<div class="small dim" style="padding:1rem; text-align:center">該当する項目がありません</div>`;
  list.querySelectorAll("[data-pick-val]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const val = btn.dataset.pickVal;
      const cb = POP.onPick;
      closePicker();
      if (cb) cb(val);
    });
  });
}

function parseTraceLines(text) {
  return String(text || "").split(/\r?\n/).map((ln) => ln.trim()).filter(Boolean).map((ln) => {
    const mTurn = ln.match(/^(T\d+)\s*(.*)$/);
    if (mTurn) return { tag: mTurn[1], body: mTurn[2], win: false };
    if (/wins/i.test(ln) || /draw/i.test(ln) || /勝利|引分/.test(ln)) return { tag: "結末", body: ln, win: true };
    if (/^ability\b/i.test(ln)) return { tag: "特性", body: ln.replace(/^ability\s+/i, ""), win: false };
    return { tag: "LOG", body: ln, win: false };
  });
}

function updateBattleStatsDom(root, side) {
  const b = APP.battle[side];
  const norm = speciesNormalProfile(b.species, b.sex);
  const megaTarget = b.mega ? speciesMegaTarget(b.species, b.sex, b.item) : null;
  const nat = NATURE_BY_KEY[b.nature] || NATURES[0];
  const normStats = calcLv50Stats(norm.base, b.points, nat.up, nat.down);
  const megaStats = megaTarget ? calcLv50Stats(megaTarget.base, b.points, nat.up, nat.down) : null;
  const spSum = b.points.reduce((s, v) => s + v, 0);
  const rem = 66 - spSum;
  const reachForms = b.mega === 1 && megaTarget ? [megaTarget.base] : b.mega === 2 && megaTarget ? [norm.base, megaTarget.base] : [norm.base];
  const wasted = isWastedPoint(b.points, nat.down, reachForms);
  const uniformWarn = Math.max(...b.points) <= 16;

  const sumEl = root.querySelector(`[data-sp-sum="${side}"]`);
  if (sumEl) {
    sumEl.textContent = spSum === 66 ? "66 / 66 ✓" : spSum < 66 ? `${spSum}/66 (残 ${rem})` : `${spSum}/66 (超過 ${-rem})`;
    sumEl.className = `badge tnum ${spSum === 66 ? "good" : spSum < 66 ? "warn" : "bad"}`;
  }
  b.points.forEach((_, i) => {
    const cell = root.querySelector(`[data-sp-stat="${side}:${i}"]`);
    const stVal = b.mega === 1 && megaStats ? megaStats[i] : normStats[i];
    if (cell) {
      const megaNote = b.mega === 2 && megaStats ? `<span class="xs dim">→</span><span style="color:var(--accent)">${megaStats[i]}</span>` : "";
      cell.innerHTML = `${stVal}${megaNote}`;
    }
    const bar = root.querySelector(`[data-sp-bar="${side}:${i}"]`);
    if (bar) {
      const barVal = Math.max(stVal, megaStats ? megaStats[i] : 0);
      bar.style.width = `${Math.min(100, Math.round((barVal / 230) * 100))}%`;
    }
  });
  const alertsEl = root.querySelector(`[data-sp-alerts="${side}"]`);
  if (alertsEl) {
    alertsEl.innerHTML =
      `${spSum !== 66 ? `<div class="callout bad">ポイント合計をちょうど 66 にしてください（現在 ${spSum}）。</div>` : ""}` +
      `${wasted ? `<div class="callout warn">定義 A 警告：下降補正（${STAT_NAMES[nat.down]}）に余剰ポイントがあり、他へ回せる無駄があります。</div>` : ""}` +
      `${uniformWarn ? `<div class="callout warn">定義 B 注記：最大ポイントが 16 以下の均等配分です（探索対象外）。</div>` : ""}`;
  }
  const specOut = root.querySelector(`[data-spec-out="${side}"]`);
  if (specOut) specOut.textContent = formatSpec(b);

  const st = APP.battle;
  const sumA = st.A.points.reduce((s, v) => s + v, 0);
  const sumB = st.B.points.reduce((s, v) => s + v, 0);
  const canRun = APP.serverOk && !st.busy && sumA === 66 && sumB === 66 && st.A.moves.length >= 1 && st.B.moves.length >= 1 && st.A.species === st.B.species;
  const btnB = document.getElementById("btnRunBattle"); if (btnB) btnB.disabled = !canRun;
  const btnT = document.getElementById("btnRunTrace"); if (btnT) btnT.disabled = !canRun;
  const btnPool = document.getElementById("btnScreenCurrentA"); if (btnPool) btnPool.disabled = !(APP.serverOk && !st.busy && sumA === 66 && st.A.moves.length >= 1);
}

function wireBattleEvents() {
  const root = document.getElementById("tab-battle");
  root.querySelectorAll("[data-open-species]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const side = btn.dataset.openSpecies;
      openPicker({
        trigger: btn, kind: "species", side, current: APP.battle[side].species,
        onPick: (spId) => {
          APP.battle[side].species = spId;
          reconcileBuild(APP.battle[side], true);
          if (side === "A") syncPoolRunDefault();
          renderBattleTab();
        },
      });
    });
  });
  root.querySelectorAll("[data-open-item]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const side = btn.dataset.openItem;
      openPicker({
        trigger: btn, kind: "item", side, current: APP.battle[side].item,
        onPick: (itId) => { APP.battle[side].item = itId; renderBattleTab(); },
      });
    });
  });
  root.querySelectorAll("[data-pick-move]").forEach((card) => {
    const launch = () => {
      const [side, slotStr] = card.dataset.pickMove.split(":");
      const slot = Number(slotStr);
      openPicker({
        trigger: card, kind: "move", side, slot, current: APP.battle[side].moves[slot] || "",
        onPick: (mid) => {
          const moves = [...APP.battle[side].moves];
          if (!mid) {
            moves.splice(slot, 1);
          } else {
            const dup = moves.indexOf(mid);
            if (dup >= 0 && dup !== slot) moves[dup] = moves[slot] || "";
            moves[slot] = mid;
          }
          APP.battle[side].moves = moves.filter(Boolean);
          renderBattleTab();
        },
      });
    };
    card.addEventListener("click", (e) => { if (!e.target.closest("[data-clear-move]")) launch(); });
    card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); launch(); } });
  });
  root.querySelectorAll("[data-clear-move]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const [side, slot] = btn.dataset.clearMove.split(":");
      const moves = [...APP.battle[side].moves];
      moves.splice(Number(slot), 1);
      APP.battle[side].moves = moves;
      renderBattleTab();
    });
  });
  document.getElementById("btnDismissGuide")?.addEventListener("click", () => {
    APP.battle.hideGuide = true;
    try { localStorage.setItem("champions_hide_guide_v1", "1"); } catch (_) {}
    renderBattleTab();
  });

  root.querySelectorAll("[data-pick-mega]").forEach((btn) => {
    btn.addEventListener("click", () => {
      APP.battle[btn.dataset.side].mega = Number(btn.dataset.pickMega);

/* ---------- Tab 2: Constrained Species Search Runner ---------- */
function sortedUniqueMoves(sp) {
  const set = new Set();
  for (const arr of Object.values(sp.moves)) for (const m of arr) set.add(m);
  return [...set].sort((a, b) => (META.moves[b]?.p || 0) - (META.moves[a]?.p || 0) || mvName(a).localeCompare(mvName(b), "ja"));
}
function legalItemsForSpecies(sp) {
  const list = NON_STONE_ITEMS.map(([id]) => id);
  for (const mg of sp.megas) if (!list.includes(mg.stone)) list.push(mg.stone);
  return list;
}
function legalAbilitiesForSpecies(sp) {
  const set = new Set();
  for (const arr of Object.values(sp.abilities)) for (const a of arr) set.add(a);
  for (const mg of sp.megas) set.add(mg.ability);
  return [...set];
}

function hasActiveFilters(f) {
  return (
    f.move_pool !== null ||
    f.required_moves.length > 0 ||
    JSON.stringify(f.move_counts) !== "[4]" ||
    f.items !== null ||
    f.megas !== null ||
    f.abilities !== null ||
    f.sexes !== null ||
    f.natures !== null ||
    f.stat_min.some((x) => x > 0) ||
    f.stat_max.some((x) => x < 32) ||
    f.allocText.trim().length > 0
  );
}

function searchFilterPayload() {
  const st = APP.search;
  const f = st.filters;
  const sp = META.species[st.species];
  const allMoves = sortedUniqueMoves(sp);
  let allocs = null;
  const allocLines = f.allocText.split(/\r?\n/).map((ln) => ln.trim()).filter(Boolean);
  if (allocLines.length) {
    allocs = allocLines.map((line, idx) => {
      const parts = line.split(",").map((x) => Number(x.trim()));
      if (parts.length !== 6 || parts.some((v) => !Number.isInteger(v) || v < 0 || v > 32) || parts.reduce((a, b) => a + b, 0) !== 66) {
        throw new Error(`固定配分 ${idx + 1} 行目が不正です（0〜32 の整数 6 個・合計 66 が必要）`);
      }
      return parts;
    });
  }
  if (!hasActiveFilters(f)) return null;
  const movePool = f.move_pool === null ? null : (f.move_pool.length === allMoves.length ? null : f.move_pool);
  return {
    move_pool: movePool,
    required_moves: f.required_moves.length ? f.required_moves : null,
    move_counts: f.move_counts,
    items: f.items,
    megas: f.megas,
    abilities: f.abilities,
    sexes: f.sexes,
    natures: f.natures,
    stat_min: f.stat_min,
    stat_max: f.stat_max,
    allocations: allocs,
  };
}

function buildActiveConstraintChips(sp) {
  const f = APP.search.filters;
  const chips = [];
  const allMoves = sortedUniqueMoves(sp);
  const allItems = legalItemsForSpecies(sp);
  const allAbs = legalAbilitiesForSpecies(sp);
  if (f.megas !== null) chips.push(`メガ: ${f.megas.join(",") || "なし"}`);
  if (f.sexes !== null) chips.push(`性別: ${f.sexes.join(",") || "なし"}`);
  if (f.abilities !== null) chips.push(`特性: ${f.abilities.length}/${allAbs.length}`);
  if (f.items !== null) chips.push(`持ち物: ${f.items.length}/${allItems.length}`);
  if (f.move_pool !== null) chips.push(`技プール: ${f.move_pool.length}/${allMoves.length}`);
  if (f.required_moves.length) chips.push(`必須技: ${f.required_moves.map(mvName).join("・")}`);
  if (JSON.stringify(f.move_counts) !== "[4]") chips.push(`技数: ${f.move_counts.join(",") || "なし"}`);
  if (f.natures !== null) chips.push(`性格: ${f.natures.length}/21`);
  if (f.stat_min.some((x) => x > 0) || f.stat_max.some((x) => x < 32)) chips.push("SPレンジ制限");
  if (f.allocText.trim()) chips.push("固定配分指定");
  return chips;
}

function parseJobProgress(j) {
  const stages = j.stages || [];
  const doneCount = stages.filter((s) => s.done).length;
  const activeStage = j.status === "generating" ? "候補生成"
    : j.status === "complete" ? "完了"
    : (stages.find((s) => !s.done)?.name || "running");
  const logs = j.logs || [];
  let stagePct = null, detail = "";
  for (let idx = logs.length - 1; idx >= 0; idx--) {
    const m = logs[idx].match(/\[progress\]\s+(\S+)\s+shards\s+(\d+)\/(\d+)\s+\((\d+)%\)(?:\s+elapsed\s+(\d+)s\s+eta\s+(\d+)s)?/i);
    if (m) {
      stagePct = Number(m[4]);
      detail = `${m[1]} · shard ${m[2]}/${m[3]} (${m[4]}%)${m[6] !== undefined ? ` · 残り約 ${m[6]}s` : ""}`;
      break;
    }
  }
  const overallPct = j.status === "complete" ? 100
    : stages.length ? Math.min(99, Math.round(((doneCount + (stagePct !== null ? stagePct / 100 : 0.15)) / stages.length) * 100))
    : (stagePct ?? 10);
  const lastLine = [...logs].reverse().find((ln) => ln.trim()) || "";
  return { activeStage, detail: detail || lastLine, overallPct };
}

          ${j.status === "complete" ? `<button type="button" class="btn sm primary" data-job-open="${esc(j.run)}">結果分析を開く</button>` : ""}
        </div>
      </div>

        <div class="row" style="justify-content:space-between; margin-top:auto; padding-top:0.55rem; border-top:1px solid var(--border)">

          <div class="row" style="gap:0.35rem">
            ${[1, 2, 3, 4].map((c) => {
              const on = f.move_counts.includes(c);
              return `<button type="button" class="chip ${on ? "on" : ""}" data-flt-mcnt="${c}">${on ? `<span class="chip-check">✓</span>` : ""}${c}技</button>`;
            }).join("")}
          </div>
        </div>
      </div>

      <div class="card-sub" style="display:flex; flex-direction:column; gap:0.75rem">
        <div class="row" style="justify-content:space-between">
          <div class="field"><span class="field-lbl">メガ区分</span>
            <div class="row" style="gap:0.35rem">${allMegas.map((m) => {
              const on = curMegas.has(m);
              return `<button type="button" class="chip ${on ? "on" : ""}" data-flt-mega="${m}">${on ? `<span class="chip-check">✓</span>` : ""}${MEGA_SHORT[m]}</button>`;

            const on = curAbs.has(ab);
            return `<button type="button" class="chip ${on ? "on" : ""}" data-flt-ab="${esc(ab)}">${on ? `<span class="chip-check">✓</span>` : ""}${esc(abName(ab))}</button>`;

              <button type="button" id="btnItModeAll" aria-pressed="${!itCustom}">すべて許可</button>

            <div class="seg">
              ${[["all", "全"], ["stone", "メガ石"], ["nonstone", "通常"]].map(([k, l]) =>

              ).join("")}
            </div>
            ${itCustom ? `<button type="button" class="btn xs ghost" id="btnSrchItNone">クリア</button>` : `<button type="button" class="btn xs ghost" id="btnSrchItStone">メガ石のみ</button>`}

          <div class="chip-grid" style="max-height:130px">
            ${visItems.map((it) => {
              const on = itCustom && selItemSet.has(it);
              return `<button type="button" class="chip ${on ? "on" : ""}" data-flt-item="${esc(it)}">${on ? `<span class="chip-check">✓</span>` : ""}${esc(itName(it))}</button>`;

        <div>
          <span class="field-lbl">ポイント配分レンジ（各 0〜32、合計 66）</span>
          <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:0.35rem; margin-top:0.25rem">
            ${STAT_NAMES.map((lbl, i) => `<div class="field"><span class="xs dim" style="text-align:center;font-weight:700">${lbl}</span>
              <input type="number" min="0" max="32" value="${f.stat_min[i]}" data-flt-smin="${i}" title="${lbl} 最小" style="text-align:center; padding:0.2rem" />
              <input type="number" min="0" max="32" value="${f.stat_max[i]}" data-flt-smax="${i}" title="${lbl} 最大" style="text-align:center; padding:0.2rem" />
            </div>`).join("")}

        <div>
          <div class="row" style="justify-content:space-between; margin-bottom:0.3rem">
            <div>
              <b class="small">性格</b>
              <span class="xs dim" style="margin-left:0.3rem">${natCustom ? `選択中 ${f.natures.length} 性格` : "無制限（全21種）"}</span>
            </div>
            <div class="row" style="gap:0.25rem">
              <button type="button" class="btn xs ghost" id="btnSrchNatPhys">物理(C↓)</button>
              <button type="button" class="btn xs ghost" id="btnSrchNatSpec">特殊(A↓)</button>
              <div class="seg">
                <button type="button" id="btnNatModeAll" aria-pressed="${!natCustom}">全性格許可</button>
                <button type="button" id="btnNatModeCustom" aria-pressed="${natCustom}">選ぶ</button>
              </div>
              ${natCustom ? `<button type="button" class="btn xs ghost" id="btnSrchNatNone">クリア</button>` : ""}
            </div>
          </div>
          <div class="chip-grid" style="max-height:110px">
            ${NATURES.map((n) => {
              const on = natCustom && selNatSet.has(n.key);
              return `<button type="button" class="chip ${on ? "on" : ""}" data-flt-nat="${n.key}">${on ? `<span class="chip-check">✓</span>` : ""}${esc(n.short)} <span class="xs dim">${n.corr}</span></button>`;
            }).join("")}
          </div>
        </div>

        <div class="field">
          <span class="field-lbl">明示的な固定配分リスト（任意・1行に H,A,B,C,D,S）</span>
          <textarea rows="2" id="inSrchAllocs" class="mono" placeholder="例: 32,32,2,0,0,0">${esc(f.allocText)}</textarea>
        </div>
      </div>
    </div>
  </section>`;

  const activeChips = buildActiveConstraintChips(sp);
  const unfinishedRuns = APP.runs.filter((r) => !r.complete && !APP.jobs.some((j) => j.run === r.run && (j.status === "running" || j.status === "generating")));

  el.innerHTML = `
    ${st.recentNotice ? `<div class="callout good" style="justify-content:space-between; align-items:center">
      <span>🎉 探索 <b>${esc(st.recentNotice.run)}</b>（${esc(spName(st.recentNotice.species))}）が完了しました！</span>
      <div class="row">
        <button type="button" class="btn sm primary" id="btnNoticeOpenViewer">結果分析を開く</button>
        <button type="button" class="btn xs ghost" id="btnDismissNotice">閉じる</button>
      </div>
    </div>` : ""}

    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">1. 探索ターゲット & 規模の設定 <span class="badge acc">操縦方針 obsh4</span></h2>
        </div>
        ${unfinishedRuns.length ? `<div class="row"><span class="xs dim">未完了ラン:</span>${unfinishedRuns.slice(0, 4).map((r) => `<button type="button" class="btn xs ghost" data-job-resume="${esc(r.run)}">${esc(r.run)} を再開</button>`).join("")}</div>` : ""}
      </div>

      <div class="grid-3" style="margin-bottom:0.85rem">
        <div class="field">
          <span class="field-lbl">探索する種族</span>
          <button type="button" class="picker-trigger compact" id="btnSrchSpeciesPick">
            <span><b>${esc(sp.ja)}</b> <span class="xs dim mono">${esc(sp.id)}</span></span>
            <span class="xs dim">変更 ▾</span>
          </button>
        </div>
        <div class="field">
          <span class="field-lbl">出力フォルダ名（runs/ 配下）</span>
          <input type="text" id="inSrchRunName" value="${esc(st.runName)}" />
        </div>
        <div class="row" style="gap:0.5rem; flex-wrap:nowrap">
          <div class="field" style="flex:1"><span class="field-lbl">並列数 (--shards)</span><input type="number" id="inSrchShards" min="1" max="64" value="${st.shards}" /></div>
          <div class="field" style="flex:1"><span class="field-lbl">候補数上書き</span><input type="number" id="inSrchCandOverride" min="1" max="1000000" placeholder="既定値" value="${esc(st.candidatesOverride)}" /></div>
        </div>
      </div>

      <span class="field-lbl" style="display:block; margin-bottom:0.35rem">探索規模</span>
      <div class="tier-grid">
        ${tiers.map((t) => `<button type="button" class="tier-card" data-pick-tier="${t.id}" aria-pressed="${t.id === st.tier}">
          <div class="row" style="justify-content:space-between"><b>${esc(t.title)}</b>${t.tag ? `<span class="badge acc">${esc(t.tag)}</span>` : ""}</div>
          <div class="small dim tnum">${esc(t.desc)}</div>
          <div class="xs mono" style="color:var(--accent); font-weight:700">${esc(t.time)}</div>
        </button>`).join("")}
      </div>

      <div class="row" style="justify-content:space-between; margin-top:0.9rem; padding-top:0.85rem; border-top:1px solid var(--border)">
        <div class="row">
          <span class="small"><b>探索範囲：</b>${activeChips.length ? "" : "<span class='dim'>無制約（種族全体）</span>"}</span>
          ${activeChips.map((c) => `<span class="badge warn">${esc(c)}</span>`).join("")}
        </div>
        <div class="row">
          <button type="button" class="btn" id="btnEstimateSearch" ${APP.serverOk ? "" : "disabled"}>候補数を見積もる</button>
          <button type="button" class="btn primary" id="btnStartSearch" ${APP.serverOk ? "" : "disabled"}>探索を開始</button>
        </div>
      </div>

      ${st.estimate ? `<div class="callout good" id="srchEstimateAlert" style="margin-top:0.75rem">
        見積もり：対象空間 <b>${st.estimate.spaceSize === null ? "無制約（全空間）" : `${st.estimate.spaceSize.toLocaleString("ja-JP")} 通り${st.estimate.exact ? "（厳密）" : "（上限概算）"}`}</b>
        → モード：<b>${st.estimate.enumerationMode === "exhaustive" ? "全列挙（重複なし）" : "一様サンプリング"}</b>（生成候補数 ${st.estimate.targetCandidates.toLocaleString("ja-JP")}）
      </div>` : ""}
      ${st.error ? `<div class="callout bad" style="margin-top:0.75rem">${esc(st.error)}</div>` : ""}
      ${!APP.serverOk ? `<div class="callout warn" style="margin-top:0.75rem">探索の実行・見積もりには <span class="mono">python3 viewer/server.py</span> の起動が必要です。</div>` : ""}
    </section>

    ${filterPanel}

    <section class="card">
      <div class="card-head">
        <div class="row">
          <h3 class="card-title">探索ジョブ & リアルタイム進捗パイプライン</h3>
          ${APP.jobs.some((j) => j.status === "generating" || j.status === "running") ? `<span class="badge acc">● 0.8 秒ごとに自動更新中</span>` : ""}
        </div>
        <button type="button" class="btn sm ghost" id="btnRefreshJobs" ${APP.serverOk ? "" : "disabled"}>最新状態を取得</button>
      </div>
      <div id="searchJobsHost" style="display:flex; flex-direction:column; gap:0.65rem">${renderSearchJobsInner()}</div>
    </section>
  `;

  wireSearchEvents();
  const grids = el.querySelectorAll(".chip-grid");
  if (grids.length === prevScrolls.length) grids.forEach((g, idx) => { g.scrollTop = prevScrolls[idx]; });
}

function wireSearchEvents() {
  const root = document.getElementById("tab-search");
  const st = APP.search;
  const sp = META.species[st.species];
  const f = st.filters;
  const clearEst = () => { st.estimate = null; document.getElementById("srchEstimateAlert")?.remove(); };

  document.getElementById("btnNoticeOpenViewer")?.addEventListener("click", async () => {
    const run = st.recentNotice?.run;
    st.recentNotice = null;
    document.title = "Champions 1on1 Studio — Stage 8 全種族ワークベンチ";
    if (run) { await loadRunIntoViewer(run); switchTab("viewer"); }
  });
  document.getElementById("btnDismissNotice")?.addEventListener("click", () => {
    st.recentNotice = null;
    document.title = "Champions 1on1 Studio — Stage 8 全種族ワークベンチ";
    renderSearchTab();
  });

  document.getElementById("btnSrchSpeciesPick")?.addEventListener("click", (e) => {
    openPicker({
      trigger: e.currentTarget, kind: "species", current: st.species,
      onPick: (spId) => {
        st.species = spId;
        st.runName = `${spId}-${st.tier}`;
        st.filters = { move_pool: null, required_moves: [], move_counts: [4], items: null, megas: null, abilities: null, sexes: null, natures: null, stat_min: [0,0,0,0,0,0], stat_max: [32,32,32,32,32,32], allocText: "" };
        st.estimate = null;
        renderSearchTab();
      },
    });
  });
  root.querySelectorAll("[data-pick-tier]").forEach((btn) => {
    btn.addEventListener("click", () => {
      st.tier = btn.dataset.pickTier;
      st.runName = `${st.species}-${st.tier}`;
      st.estimate = null;
      renderSearchTab();
    });
  });
  document.getElementById("btnResetFilters")?.addEventListener("click", () => {
    st.filters = { move_pool: null, required_moves: [], move_counts: [4], items: null, megas: null, abilities: null, sexes: null, natures: null, stat_min: [0,0,0,0,0,0], stat_max: [32,32,32,32,32,32], allocText: "" };
    st.estimate = null;
    renderSearchTab();
  });
  document.getElementById("inSrchRunName")?.addEventListener("input", (e) => { st.runName = e.target.value; });
  document.getElementById("inSrchShards")?.addEventListener("change", (e) => {
    st.shardsTouched = true;
    const n = Number(e.target.value);
    st.shards = Number.isFinite(n) ? Math.max(1, Math.min(64, Math.trunc(n))) : 4;
  });
  document.getElementById("inSrchCandOverride")?.addEventListener("input", (e) => { st.candidatesOverride = e.target.value; clearEst(); });

  document.getElementById("inSrchMvFilter")?.addEventListener("input", (e) => {
    st.moveFilter = e.target.value; renderSearchTab();
    const a = document.getElementById("inSrchMvFilter"); if (a) { a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
  });
  document.getElementById("inSrchItFilter")?.addEventListener("input", (e) => {
    st.itemFilter = e.target.value; renderSearchTab();
    const a = document.getElementById("inSrchItFilter"); if (a) { a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
  });
  root.querySelectorAll("[data-srch-mcat]").forEach((b) => b.addEventListener("click", () => { st.moveCat = b.dataset.srchMcat; renderSearchTab(); }));
  root.querySelectorAll("[data-srch-icat]").forEach((b) => b.addEventListener("click", () => { st.itemCat = b.dataset.srchIcat; renderSearchTab(); }));

  // Move pool mode & controls (unrestricted null vs explicit custom array starting empty!)
  document.getElementById("btnMvModeAll")?.addEventListener("click", () => { f.move_pool = null; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnMvModeCustom")?.addEventListener("click", () => { if (f.move_pool === null) f.move_pool = [...f.required_moves]; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnSrchMvAll")?.addEventListener("click", () => { f.move_pool = [...sortedUniqueMoves(sp)]; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnSrchMvNone")?.addEventListener("click", () => { f.move_pool = []; f.required_moves = []; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnFixMoveCount")?.addEventListener("click", () => {
    const k = f.move_pool ? f.move_pool.length : 4;
    f.move_counts = [1, 2, 3, 4].filter((x) => x <= k);
    st.estimate = null; renderSearchTab();
  });
  root.querySelectorAll("[data-unpick-mv]").forEach((btn) => btn.addEventListener("click", () => {
    const m = btn.dataset.unpickMv;
    if (f.move_pool !== null) f.move_pool = f.move_pool.filter((x) => x !== m);
    f.required_moves = f.required_moves.filter((x) => x !== m);
    st.estimate = null; renderSearchTab();
  }));
  root.querySelectorAll("[data-flt-move]").forEach((chip) => {
    chip.addEventListener("click", (e) => {
      if (e.target.closest("[data-flt-req]")) return;
      const m = chip.dataset.fltMove;
      if (f.move_pool === null) {
        f.move_pool = [...new Set([...f.required_moves, m])];
      } else {
        const set = new Set(f.move_pool);
        if (set.has(m)) { set.delete(m); f.required_moves = f.required_moves.filter((x) => x !== m); }
        else set.add(m);
        f.move_pool = [...set];
      }
      st.estimate = null; renderSearchTab();
    });
  });
  root.querySelectorAll("[data-flt-req]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const m = btn.dataset.fltReq;
      const reqSet = new Set(f.required_moves);
      if (reqSet.has(m)) {
        reqSet.delete(m);
      } else {
        reqSet.add(m);
        if (f.move_pool !== null && !f.move_pool.includes(m)) {
          f.move_pool = [...f.move_pool, m];
        }
      }
      f.required_moves = [...reqSet];
      st.estimate = null; renderSearchTab();
    });
  });

  // Item mode & controls
  document.getElementById("btnItModeAll")?.addEventListener("click", () => { f.items = null; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnItModeCustom")?.addEventListener("click", () => { if (f.items === null) f.items = []; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnSrchItNone")?.addEventListener("click", () => { f.items = []; st.estimate = null; renderSearchTab(); });
  document.getElementById("btnSrchItStone")?.addEventListener("click", () => {
    f.items = legalItemsForSpecies(sp).filter((it) => META.items[it]?.stone);
    st.estimate = null; renderSearchTab();
  });
  root.querySelectorAll("[data-flt-item]").forEach((btn) => btn.addEventListener("click", () => {
    const it = btn.dataset.fltItem;
    if (f.items === null) f.items = [it];
    else {
      const set = new Set(f.items);
      if (set.has(it)) set.delete(it); else set.add(it);
      f.items = [...set];
    }
    st.estimate = null; renderSearchTab();
  }));

  // Nature mode & controls
